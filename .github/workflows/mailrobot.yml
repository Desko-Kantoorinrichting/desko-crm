name: Mailrobot

# Elk kwartier op werkdagen tussen 6:00 en 17:00 UTC (8:00–19:00 NL zomertijd).
# Het script controleert zelf de Nederlandse kantoortijden en feestdagen.
on:
  schedule:
    - cron: '*/15 6-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mailrobot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mails versturen en reacties verwerken
        run: node scripts/mailrobot.mjs
        env:
          DATA_REPO: Desko-Kantoorinrichting/desko-crm-data
          DATA_TOKEN: ${{ secrets.DATA_TOKEN }}
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_AFZENDER: ${{ secrets.MS_AFZENDER }}
