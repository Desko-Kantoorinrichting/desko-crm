<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Desko CRM</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Desko CRM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="reeks.js"></script>
<script src="db.js"></script>
<script src="auth.js"></script>
<style>
/* Layout: phone — sticky brand bar, content column, bottom tab bar.
   Desktop (≥960px) — fixed left sidebar with brand + navigation, wider content, detail in two columns. */
:root{
  /* Desko huisstijl 2024: Black, Evergreen Bliss #51C26F, Sunlit Gold #F2E901, Mystic Jade (verloop), Peachy Cream #FBF4E9, Sandstone #FBF3EF. Lettertype League Spartan. */
  --brand:#000000; --brand-2:#141414; --brand-ink:#FFFFFF;
  --evergreen:#51C26F; --gold:#F2E901; --jade:linear-gradient(90deg,#51C26F 0%,#F2E901 100%);
  --bg:#FBF4E9; --surface:#FFFFFF; --sunk:#F4ECDF; --hover:#FDF9F2; --ink:#000000; --muted:#5C5A55; --faint:#8E8A82; --line:#EAE1D3;
  --accent:#1F7A3C; --accent-ink:#000000; --accent-soft:#E2F4E7;
  --klant:#1F7A3C; --klant-soft:#E2F4E7;
  --prospect:#6A6400; --prospect-soft:#FBF7BF;
  --commissie:#FFFFFF; --commissie-soft:#000000;
  --warn:#B23B12; --warn-soft:#FCE5DA;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(60,40,10,.06);
  --font-display:"League Spartan","Segoe UI",system-ui,sans-serif;
  --font-body:"League Spartan","Segoe UI",system-ui,sans-serif;
  --r:16px; --side:248px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#000000; --brand-2:#141414; --brand-ink:#FFFFFF;
  --bg:#0B0B0B; --surface:#161616; --sunk:#202020; --hover:#1C1C1C; --ink:#F7F3EC; --muted:#AAA59C; --faint:#7D7972; --line:#2A2A2A;
  --accent:#6FD38A; --accent-soft:#16301E;
  --klant:#6FD38A; --klant-soft:#16301E; --prospect:#F2E901; --prospect-soft:#2E2C08;
  --commissie:#000000; --commissie-soft:#FBF4E9; --warn:#FF9C76; --warn-soft:#3A1E14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#000000; --brand-2:#141414; --brand-ink:#FFFFFF;
  --bg:#0B0B0B; --surface:#161616; --sunk:#202020; --hover:#1C1C1C; --ink:#F7F3EC; --muted:#AAA59C; --faint:#7D7972; --line:#2A2A2A;
  --accent:#6FD38A; --accent-soft:#16301E;
  --klant:#6FD38A; --klant-soft:#16301E; --prospect:#F2E901; --prospect-soft:#2E2C08;
  --commissie:#000000; --commissie-soft:#FBF4E9; --warn:#FF9C76; --warn-soft:#3A1E14;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--font-body);font-size:16.5px;line-height:1.42;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--brand);z-index:30}
h1,h2,h3{font-family:var(--font-display);margin:0;line-height:1.08;text-wrap:balance;letter-spacing:-.015em;font-weight:700}
h1{font-size:1.85rem;font-weight:700}
h2{font-size:1.08rem;font-weight:650}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}
.ic.lg{width:22px;height:22px}

/* brand bar (phone) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--brand);color:var(--brand-ink)}
.topbar .in{max-width:880px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;color:inherit;text-decoration:none}
.brand .logo{height:22px;width:auto;display:block}
.brand .tag{font-family:var(--font-body);font-weight:600;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#000;background:var(--jade);border-radius:999px;padding:3px 8px 2px;line-height:1.2}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.82rem;background:rgba(255,255,255,.14);color:var(--brand-ink);border:1px solid rgba(255,255,255,.22);cursor:pointer}

.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 128px;display:flex;flex-direction:column;gap:22px}
.page-head{display:flex;flex-direction:column;gap:6px}
.page-head .row-line{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.sub{color:var(--muted);font-size:.94rem}
.section{display:flex;flex-direction:column;gap:12px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.section-title h2{font-size:1rem}
.count{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--muted);font-size:.78rem;font-weight:700}
.empty{padding:28px 20px;border:1.5px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--surface)}
.empty .ic{width:28px;height:28px;color:var(--faint)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.93rem;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--hover);border-color:color-mix(in srgb,var(--line) 60%,var(--muted))}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--jade);border-color:transparent;color:#000;font-weight:700}
.btn.primary:hover{filter:brightness(.96) saturate(1.1)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
.btn.small{min-height:34px;padding:0 13px;font-size:.86rem;border-radius:999px}
.btn:disabled{opacity:.5;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.icon-btn{border:0;background:transparent;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--sunk)}
.back{align-self:flex-start;margin-left:-10px;padding-left:6px}

/* chips + monograms */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:.75rem;font-weight:650;white-space:nowrap;background:var(--sunk);color:var(--muted);line-height:1.3}
.k-klant{background:var(--klant-soft);color:var(--klant)}
.k-prospect{background:var(--prospect-soft);color:var(--prospect)}
.k-commissie{background:var(--commissie-soft);color:var(--commissie)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.chip.tag::before{content:"#";opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.mono{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;flex:none;letter-spacing:.02em}
.mono.lg{width:62px;height:62px;font-size:1.35rem}

/* today hero */
.hero{background:var(--brand);color:var(--brand-ink);margin-top:-22px;padding:22px 0 26px;border-radius:0 0 26px 26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(closest-side,rgba(242,233,1,.30),rgba(81,194,111,.18) 55%,transparent);pointer-events:none}
.grad{background:var(--jade);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .in{display:flex;flex-direction:column;gap:18px;position:relative;z-index:1}
.hero .eyebrow{color:var(--gold)}
.hero h1{color:var(--brand-ink);font-size:2rem}
.hero p.lead{opacity:.82}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:var(--brand-ink);border-radius:13px;padding:11px 12px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;transition:background .15s}
.stat:hover{background:rgba(255,255,255,.14)}
.stat b{font-family:var(--font-display);font-size:1.75rem;font-weight:800;line-height:1.05}
.stat span{font-size:.78rem;opacity:.8;display:flex;align-items:center;gap:5px}
.stat .ic{width:14px;height:14px}
.wrap.today{padding-top:0}
.hero-wrap{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* task cards */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.task-head{display:flex;gap:12px;align-items:flex-start}
.task-head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.task-head .t .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.task h3 button{all:unset;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.task h3 button:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.task h3 button:focus-visible{outline:2px solid var(--accent)}
.task .what{color:var(--ink);font-size:.95rem}
.due{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:650;white-space:nowrap}
.due .ic{width:14px;height:14px}
.due.late{color:var(--warn)}
.task .btns .btn{flex:1;min-width:120px}
.soon{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.soon button{all:unset;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.soon button:hover{background:var(--hover)}
.soon button:first-child{border-top:0}
.cal{display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;line-height:1.1;width:44px}
.cal span{font-size:.62rem;text-transform:uppercase;font-weight:700;letter-spacing:.06em;background:var(--sunk);color:var(--muted);width:100%;text-align:center;padding:2px 0}
.cal b{font-family:var(--font-display);font-size:1.05rem;padding:3px 0 4px}
.soon .t{min-width:0}
.soon .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon .t span{font-size:.86rem;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.soon .ic{color:var(--faint)}

/* list */
.toolbar{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 40px;box-shadow:var(--shadow)}
.toolbar .btn{height:46px}
.btn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:.76rem;color:var(--muted);font-weight:700;min-width:0;text-transform:uppercase;letter-spacing:.05em}
.filters select{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:0 8px;min-width:0;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.listbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.row{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);transition:background .12s}
.row:hover{background:var(--hover)}
.row:first-child{border-top:0}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.row .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.row-top b{font-weight:650;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:.85rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .next{font-size:.83rem;color:var(--accent);font-weight:600;display:flex;align-items:center;gap:5px;min-width:0}
.row .next span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .next.late{color:var(--warn)}
.row .next .ic{width:14px;height:14px}
.row > .ic{color:var(--faint)}
.row.static{cursor:default;grid-template-columns:1fr auto}
.row.static:hover{background:transparent}
@media (max-width:440px){.row .lbl{display:none}.row .btn.small{padding:0 10px}}
.row .meta.wrap{white-space:normal}
.money{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.money div{background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.money span{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.money b{font-size:1rem;font-variant-numeric:tabular-nums;font-family:var(--font-display);font-weight:650}
.money div:last-child b{color:var(--klant)}
@media (max-width:440px){.money{grid-template-columns:repeat(2,1fr)}}

/* detail */
.detail-head{display:flex;gap:16px;align-items:flex-start}
.detail-head .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.detail-head h1{font-size:1.7rem}
.detail-head .meta{color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.92rem}
.detail-head .meta span{display:inline-flex;align-items:center;gap:5px}
.detail-head .meta .ic{width:15px;height:15px;color:var(--faint)}
.statusbar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.opvolg{border-radius:var(--r);padding:16px;background:var(--accent-soft);display:flex;flex-direction:column;gap:8px;border:1px solid color-mix(in srgb,var(--accent) 18%,transparent)}
.opvolg.late{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.opvolg.idle{background:var(--surface);border:1px dashed var(--line)}
.opvolg .label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:750;color:var(--muted);display:flex;align-items:center;gap:6px}
.opvolg .label .ic{width:14px;height:14px}
.opvolg .big{font-weight:650;font-size:1.06rem;font-family:var(--font-display)}
.progress{display:flex;gap:4px}
.progress i{height:5px;flex:1;border-radius:3px;background:color-mix(in srgb,var(--ink) 12%,transparent)}
.progress i.on{background:var(--jade)}
.opvolg.late .progress i.on{background:var(--warn)}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.quick button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.76rem;font-weight:600;color:var(--muted);text-align:center;padding:4px 0;border-radius:12px}
.quick button span.c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent);box-shadow:var(--shadow);transition:background .15s,transform .1s}
.quick button:hover span.c{background:var(--accent-soft)}
.quick button:active span.c{transform:scale(.96)}
.quick button:focus-visible{outline:2px solid var(--accent)}
@media (max-width:360px){.quick{grid-template-columns:repeat(3,1fr);row-gap:12px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.contact{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding-top:12px;border-top:1px solid var(--line)}
.contact:first-of-type{border-top:0;padding-top:0}
.contact .who{display:flex;flex-direction:column;gap:2px;min-width:0}
.contact .person{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--muted);font-weight:700;font-size:.82rem}
.contact .links{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.9rem;margin-top:4px}
.contact .links a{display:inline-flex;align-items:center;gap:5px;text-decoration:none;word-break:break-all}
.contact .links a:hover{text-decoration:underline}
.contact .links .ic{width:14px;height:14px}
.kv{display:grid;grid-template-columns:8.5rem 1fr;gap:8px 12px;font-size:.93rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;position:relative}
.ev{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:0 0 16px;position:relative}
.ev:not(:last-child)::before{content:"";position:absolute;left:16px;top:34px;bottom:0;width:2px;background:var(--line)}
.ev .ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);position:relative;z-index:1}
.ev .ico .ic{width:16px;height:16px}
.ev.sys .ico{background:var(--sunk);color:var(--faint)}
.ev.t-bel .ico{background:var(--prospect-soft);color:var(--prospect)}
.ev.t-mail_in .ico,.ev.t-mail_uit .ico{background:var(--commissie-soft);color:var(--commissie)}
.ev .body{min-width:0;display:flex;flex-direction:column;gap:3px;padding-top:6px}
.ev .head{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;flex-wrap:wrap}
.ev .head b{font-weight:650}
.ev .head span{color:var(--faint);white-space:nowrap;font-size:.82rem}
.ev p{white-space:pre-wrap;overflow-wrap:anywhere;font-size:.93rem}
.ev.sys p{color:var(--muted);font-size:.86rem}
.deal{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.deal:first-of-type{border-top:0;padding-top:0}
.deal .line{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.detail-cols{display:grid;grid-template-columns:1fr;gap:22px}
.detail-cols > div{display:flex;flex-direction:column;gap:22px;min-width:0}

/* nav: bottom bar on phone, sidebar on desktop */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs .side-brand,nav.tabs .side-foot{display:none}

<body>
<header class="topbar" id="topbar" hidden></header>
<main id="app"></main>
<button class="fab" id="fab" data-act="nieuw" hidden></button>
<nav class="tabs" aria-label="Hoofdmenu" hidden><div class="side-brand" id="side-brand"></div><div class="in" id="tabs"></div><div class="side-foot" id="side-foot"></div></nav>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ============================================================
   Desko CRM — eenvoudige versie
   Opslag: privé GitHub-repository (zie db.js). Collecties:
   bedrijven, activiteiten, deals, weergaven, exportlog, instellingen.
   ============================================================ */

const KOPJES = {
  klant:     {naam:'Klanten',        enk:'Klant'},
  prospect:  {naam:'Prospects',      enk:'Prospect'},
  commissie: {naam:'Lead commissie', enk:'Commissie'}
};
const STATUSSEN = ['nieuw','contact gehad','afspraak','offerte','gewonnen','verloren'];
const GROOTTES = ['1-10','11-50','51-100','101-250','250+'];
const DEALSTATUS = ['verwacht','verdiend','gefactureerd','ontvangen'];
const BRANCHES = ['Bouw','Zorg','Onderwijs','Overheid','Zakelijke dienstverlening','ICT','Financiële dienstverlening','Logistiek','Retail','Horeca','Industrie','Vastgoed','Juridisch','Architectuur'];
const ACT_TYPES = {
  bezoek:   {naam:'Bezoek'},
  bel:      {naam:'Telefoon'},
  mail_uit: {naam:'Mail gestuurd'},
  mail_in:  {naam:'Reactie ontvangen'},
  afspraak: {naam:'Afspraak'},
  notitie:  {naam:'Notitie'},
  systeem:  {naam:'Systeem'}
};
const CONTACT_TYPES = ['bezoek','bel','mail_uit','mail_in','afspraak'];
const COMMISSIE_TAG = 'commissierelatie';

const DEFAULT_INST = REEKS.DEFAULT_INST;

/* ---------- Mail ----------
   Reeksmails worden ingepland in de collectie `mails` (status gepland). De mailrobot
   (scripts/mailrobot.mjs, GitHub Actions) verstuurt ze vanuit de Microsoft 365-mailbox
   zodra die gekoppeld is en meldt zich in robot/status. Zolang de robot niet actief is,
   opent Ferry een klaarstaande mail in zijn mailprogramma en markeert hem als verstuurd. */
const robotActief = () => !!(S.robot?.gekoppeld && S.robot.laatsteRun && Date.now() - new Date(S.robot.laatsteRun) < 2*3600*1000);

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const {clone, pad, ds, parse, addDays, diffDays, addWerkdagen} = REEKS;
const today = () => ds(new Date());
const euro = n => new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR'}).format(Number(n)||0);
const DAGEN = ['zo','ma','di','wo','do','vr','za'];
const MAANDEN = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fmtDag = s => { if(!s) return ''; const d = parse(s); return `${DAGEN[d.getDay()]} ${d.getDate()} ${MAANDEN[d.getMonth()]}`; };
const fmtTijd = iso => { const d = new Date(iso); return `${d.getDate()} ${MAANDEN[d.getMonth()]} ${d.getFullYear()!==new Date().getFullYear()?d.getFullYear()+' ':''}${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const localDT = (d=new Date()) => `${ds(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`;

function provincie(pc){
  const n = parseInt(String(pc||'').replace(/\D/g,'').slice(0,4),10);
  if(!n || n<1000) return '';
  const T = [[1000,1299,'Noord-Holland'],[1300,1379,'Flevoland'],[1380,2199,'Noord-Holland'],[2200,3399,'Zuid-Holland'],
    [3400,3999,'Utrecht'],[4000,4199,'Gelderland'],[4200,4299,'Zuid-Holland'],[4300,4599,'Zeeland'],[4600,5999,'Noord-Brabant'],
    [6000,6499,'Limburg'],[6500,7399,'Gelderland'],[7400,7799,'Overijssel'],[7800,7999,'Drenthe'],[8000,8199,'Overijssel'],
    [8200,8259,'Flevoland'],[8260,8299,'Overijssel'],[8300,8399,'Flevoland'],[8400,9299,'Friesland'],[9300,9499,'Drenthe'],[9500,9999,'Groningen']];
  const r = T.find(([a,b]) => n>=a && n<=b); return r ? r[2] : '';
}
function regio(b){
  if(b.regio) return b.regio;
  const n = parseInt(String(b.postcode||'').replace(/\D/g,'').slice(0,4),10);
  if(!n) return '';
  for(const r of S.inst.regios||[]){
    for(const part of String(r.postcodes||'').split(',')){
      const [a,z] = part.split('-').map(x => parseInt(x,10));
      if(a && n>=a && n<=(z||a)) return r.naam;
    }
  }
  return '';
}
/* ---------- state ---------- */
let db = null;
const SESSIE_KEY = 'desko-crm-sessie';
const lees = k => { try{ return localStorage.getItem(k); }catch{ return null; } };
const bewaar = (k,v) => { try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch{} };
const S = {bedrijven:[], deals:[], weergaven:[], exportlog:[], mails:[], robot:null, inst:REEKS.instellingen({}), laden:true, geenDb:false, gebruiker:null, login:{}, gebruikers:null, beheer:null};
const V = {tab:'vandaag', detail:null, zoek:{}, filters:{}, filterOpen:false, terugNaar:'vandaag'};
let acts = [], actUnsub = null;

const bedrijf = id => S.bedrijven.find(b => b.id===id);
const T = b => S.inst.termijnen[b?.kopje] || S.inst.termijnen.prospect;
const contactVan = (b,i) => (b.contacten||[])[i ?? 0] || null;
const voornaam = c => (c?.naam||'').trim().split(/\s+/)[0] || '';
function alleTags(){ const m = new Map(); S.bedrijven.forEach(b => (b.tags||[]).forEach(t => m.set(t.toLowerCase(), t))); m.set(COMMISSIE_TAG, COMMISSIE_TAG); return [...m.values()].sort((a,b)=>a.localeCompare(b)); }
function normTags(list){
  const bestaand = new Map(alleTags().map(t => [t.toLowerCase(), t]));
  const out = new Map();
  list.map(t => t.trim().replace(/\s+/g,' ')).filter(Boolean).forEach(t => { const k = t.toLowerCase(); out.set(k, bestaand.get(k) || t); });
  return [...out.values()];
}

/* ---------- opvolging ---------- */
const STAP_NAAM = {eerste:'Eerste opvolging', mail:'Opvolgmail ingepland', wacht:'Wacht op reactie', terug:'Niet opgenomen', actie:'Geplande actie'};
const geplandeMail = b => S.mails.find(m => m.bedrijfId===b.id && m.status==='gepland');

function opvolgStatus(b){
  const o = b.opvolging;
  if(!o || !o.actief) return null;
  const c = contactVan(b, o.contact), wie = c?.naam || 'de contactpersoon';
  const due = !o.gepauzeerd && o.datum <= today();
  const max = T(b).maxPogingen, pog = o.pogingen || 0;
  let label, knoppen;
  if(o.gepauzeerd){ label = 'Opvolging gepauzeerd'; knoppen = ['hervat']; }
  else if(due && pog >= max && (o.stap==='wacht' || o.stap==='terug')){ label = `${pog} pogingen zonder reactie van ${wie}. Hoe verder?`; knoppen = ['einde']; }
  else switch(o.stap){
    case 'mail': {
      const m = geplandeMail(b), wanneer = m ? fmtDag(m.datum)+' om '+(m.tijd||'09:30') : fmtDag(o.datum);
      if(!m){ label = `Opvolgmail aan ${wie}`; knoppen = ['bel','mail']; break; }
      label = robotActief() ? `Mail ${m.stap+1} aan ${wie} gaat ${due?'vandaag':wanneer} automatisch: "${m.onderwerp}"`
                            : due ? `Tijd om ${wie} te mailen: "${m.onderwerp}"` : `Mail ${m.stap+1} aan ${wie} klaar voor ${fmtDag(m.datum)}`;
      knoppen = ['bekijkmail']; break;
    }
    case 'eerste': label = due ? `Neem contact op met ${wie}${c?.functie?' ('+c.functie+')':''}. Bellen of mailen?` : `Eerste opvolging bij ${wie}`; knoppen = ['bel','mail']; break;
    case 'wacht':  label = due ? `${wie} heeft niet gereageerd. Bellen of mailen?` : `Wacht op reactie van ${wie}`; knoppen = ['bel','mail']; break;
    case 'terug':  label = due ? `${wie} nog niet bereikt. Nog een keer proberen?` : `${wie} niet bereikt, wacht op terugbellen`; knoppen = ['bel','mail']; break;
    default:       label = o.actie || 'Opvolgen'; knoppen = ['klaar'];
  }
  return {label, due, datum:o.datum, knoppen, stap:o.gepauzeerd?'gepauzeerd':o.stap, pogingen:pog, max, gepauzeerd:!!o.gepauzeerd};
}
function dueTekst(datum){
  const d = diffDays(datum, today());
  if(d<=0) return d===0 ? 'vandaag' : fmtDag(datum);
  return d===1 ? '1 dag te laat' : `${d} dagen te laat`;
}

async function updBedrijf(id, patch){ await db.collection('bedrijven').doc(id).update({...patch, bijgewerkt:new Date().toISOString()}); }
async function logAct(b, a){ await db.collection('activiteiten').add({bedrijfId:b.id, datum:new Date().toISOString(), ...a}); }
async function systeem(b, tekst){ await logAct(b, {type:'systeem', tekst}); }

async function startReeks(b, ci){
  const c = contactVan(b, ci), t = T(b);
  await annuleerGepland(b, 'nieuwe opvolging gestart');
  const reeks = REEKS.reeksVoor(b, S.inst);
  const mail = reeks ? REEKS.planMail(b, reeks, 0, today(), S.inst, S.gebruiker?.naam, ci) : null;
  if(mail){
    await db.collection('mails').add(mail);
    await updBedrijf(b.id, {opvolging:{actief:true, stap:'mail', reeks:reeks.id, contact:ci, pogingen:0, datum:mail.datum, gestart:today(), gepauzeerd:false}});
    await systeem(b, `Mailreeks "${reeks.naam}" gestart voor ${c.naam}. Mail 1 ("${mail.onderwerp}") ingepland voor ${fmtDag(mail.datum)} om ${mail.tijd}.`);
    return;
  }
  const o = {actief:true, stap:'eerste', contact:ci, pogingen:0, datum:addWerkdagen(today(), t.opvolgWerkdagen), gestart:today(), gepauzeerd:false};
  await updBedrijf(b.id, {opvolging:o});
  await systeem(b, `Opvolging gestart voor ${c?.naam||'contactpersoon'}. Eerste contactmoment: ${fmtDag(o.datum)}.${reeks && !c?.email ? ' Geen e-mailadres, dus bellen in plaats van mailen.' : ''}`);
}
async function annuleerGepland(b, reden){
  for(const m of S.mails.filter(m => m.bedrijfId===b.id && m.status==='gepland')){
    await db.collection('mails').doc(m.id).update({status:'geannuleerd', reden, geannuleerdOp:new Date().toISOString()});
    await systeem(b, `Ingeplande mail "${m.onderwerp}" geannuleerd: ${reden}.`);
  }
}
async function naPoging(b, soort){
  const o = {...clone(b.opvolging), gepauzeerd:false}, t = T(b);
  o.pogingen = (o.pogingen||0) + 1;
  if(soort==='mail'){ o.stap = 'wacht'; o.datum = addDays(today(), t.geenReactieDagen); }
  else { o.stap = 'terug'; o.datum = addWerkdagen(today(), t.nietOpgenomenWerkdagen); }
  await updBedrijf(b.id, {opvolging:o});
  await systeem(b, `Poging ${o.pogingen} van ${t.maxPogingen}. Volgende check: ${fmtDag(o.datum)}.`);
}
async function stopReeks(b, reden){
  await annuleerGepland(b, reden);
  if(!b.opvolging?.actief) return;
  await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), actief:false, gepauzeerd:false}});
  await systeem(b, `Opvolging gestopt: ${reden}.`);
}

/* Elke vastgelegde activiteit stuurt de opvolging bij. */
async function verwerkActiviteit(b, a, opts={}){
  await logAct(b, a);
  const patch = {};
  if(CONTACT_TYPES.includes(a.type)) patch.laatsteContact = today();
  if(b.kopje==='prospect' && b.status==='nieuw' && (a.type==='bezoek' || (a.type==='bel' && a.uitkomst==='gesproken') || a.type==='mail_in')) patch.status = 'contact gehad';
  if(b.kopje==='prospect' && a.type==='afspraak' && ['nieuw','contact gehad'].includes(b.status)) patch.status = 'afspraak';
  if(Object.keys(patch).length) await updBedrijf(b.id, patch);
  const fresh = {...b, ...patch};
  const actief = b.opvolging?.actief && b.opvolging.stap!=='actie';
  if(a.type==='bezoek' && opts.startReeks){ await startReeks(fresh, opts.contact ?? 0); return; }
  if(!actief) return;
  if(a.type==='bel' && a.uitkomst==='gesproken') await stopReeks(fresh, `gesproken met ${a.contactNaam||'contactpersoon'}`);
  else if(a.type==='bel' && a.uitkomst==='niet opgenomen' && fresh.opvolging.stap==='mail'){
    // De ingeplande mail gaat gewoon door; de belpoging telt wel mee.
    await updBedrijf(b.id, {opvolging:{...clone(fresh.opvolging), pogingen:(fresh.opvolging.pogingen||0)+1}});
  }
  else if(a.type==='bel' && a.uitkomst==='niet opgenomen') await naPoging(fresh, 'bel');
  else if(a.type==='mail_uit') await naPoging(fresh, 'mail');
  else if(a.type==='mail_in') await stopReeks(fresh, 'reactie ontvangen');
  else if(a.type==='afspraak') await stopReeks(fresh, 'afspraak gepland');
  else if(a.type==='bezoek') await stopReeks(fresh, 'nieuw bezoek vastgelegd');
}

/* ---------- commissie ---------- */
function berekenCommissie(afspraak, waarde){
  const a = afspraak || {};
  if(a.type==='vast') return Math.round((Number(a.waarde)||0)*100)/100;
  return Math.round((Number(waarde)||0) * (Number(a.waarde)||0)) / 100;
}
function commissieTotalen(deals){
  const t = {verwacht:0, verdiend:0, gefactureerd:0, ontvangen:0};
  deals.forEach(d => { if(t[d.status]!==undefined) t[d.status] += Number(d.commissie)||0; });
  return t;
}
function commissieTaken(){
  const out = [];
  S.deals.forEach(d => {
    const b = bedrijf(d.bedrijfId); if(!b) return;
    if(d.status==='verdiend') out.push({soort:'factureren', b, d, datum:d.verdiendOp||d.datum||today(), label:`Commissie factureren: ${euro(d.commissie)} voor ${d.omschrijving||'deal'}`});
    if(d.status==='gefactureerd' && d.gefactureerdOp){
      const vervalt = addDays(d.gefactureerdOp, Number(T(b).betaaltermijnDagen)||30);
      if(vervalt <= today()) out.push({soort:'ontvangen', b, d, datum:vervalt, label:`Commissie nog niet ontvangen: ${euro(d.commissie)} voor ${d.omschrijving||'deal'} (gefactureerd ${fmtDag(d.gefactureerdOp)})`});
    }
  });
  return out;
}

/* ---------- filters ---------- */
function filterDefs(kopje){
  const bs = S.bedrijven.filter(b => kopje==='alle' || b.kopje===kopje);
  const uniq = arr => [...new Set(arr.filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const defs = [];
  if(kopje==='alle') defs.push({k:'kopje', naam:'Kopje', opts:Object.entries(KOPJES).map(([k,v])=>[k,v.naam])});
  defs.push({k:'regio', naam:'Regio', opts:uniq(bs.map(regio)).map(x=>[x,x])});
  defs.push({k:'provincie', naam:'Provincie', opts:uniq(bs.map(b=>provincie(b.postcode))).map(x=>[x,x])});
  defs.push({k:'grootte', naam:'Medewerkers', opts:GROOTTES.map(x=>[x,x])});
  defs.push({k:'branche', naam:'Branche', opts:uniq(bs.map(b=>b.branche)).map(x=>[x,x])});
  defs.push({k:'tag', naam:'Tag', opts:uniq(bs.flatMap(b=>b.tags||[])).map(x=>[x,x])});
  if(kopje==='prospect' || kopje==='alle') defs.push({k:'status', naam:'Status', opts:STATUSSEN.map(x=>[x,x])});
  defs.push({k:'stap', naam:'Opvolging', opts:[['geen','Geen opvolging'],['eerste','Eerste opvolging'],['wacht','Wacht op reactie'],['terug','Niet opgenomen'],['actie','Geplande actie'],['gepauzeerd','Gepauzeerd'],['nu','Nu te doen']]});
  defs.push({k:'contact', naam:'Laatste contact', opts:[['30','Minder dan 30 dagen'],['30-90','30 tot 90 dagen'],['90','Meer dan 90 dagen'],['nooit','Nog nooit']]});
  if(kopje==='commissie') defs.push({k:'dealstatus', naam:'Commissiestatus', opts:DEALSTATUS.map(x=>[x,x])});
  return defs;
}
function matches(b, f, zoek){
  if(f.kopje && b.kopje!==f.kopje) return false;
  if(f.regio && regio(b)!==f.regio) return false;
  if(f.provincie && provincie(b.postcode)!==f.provincie) return false;
  if(f.grootte && b.grootte!==f.grootte) return false;
  if(f.branche && b.branche!==f.branche) return false;
  if(f.tag && !(b.tags||[]).includes(f.tag)) return false;
  if(f.status && !(b.kopje==='prospect' && b.status===f.status)) return false;
  if(f.stap){
    const s = opvolgStatus(b);
    if(f.stap==='geen' ? s : f.stap==='nu' ? !(s&&s.due) : (!s || s.stap!==f.stap)) return false;
  }
  if(f.contact){
    const lc = b.laatsteContact, d = lc ? diffDays(lc, today()) : null;
    if(f.contact==='nooit' && lc) return false;
    if(f.contact==='30' && !(lc && d<30)) return false;
    if(f.contact==='30-90' && !(lc && d>=30 && d<=90)) return false;
    if(f.contact==='90' && !(lc && d>90)) return false;
  }
  if(f.dealstatus && !S.deals.some(d => d.bedrijfId===b.id && d.status===f.dealstatus)) return false;
  if(zoek){
    const hay = [b.naam,b.plaats,b.branche,b.postcode,...(b.tags||[]),...(b.contacten||[]).flatMap(c=>[c.naam,c.email,c.functie])].join(' ').toLowerCase();
    if(!zoek.toLowerCase().split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}
function gefilterd(kopje){
  const f = V.filters[kopje] || {}, z = V.zoek[kopje] || '';
  return S.bedrijven.filter(b => (kopje==='alle' || b.kopje===kopje) && matches(b, f, z)).sort((a,b) => (a.naam||'').localeCompare(b.naam||''));
}

function initialen(naam){
  const w = String(naam||'').replace(/^Voorbeeld\s*[–-]\s*/,'').split(/[\s\-–]+/).filter(x => /[A-Za-zÀ-ÿ0-9]/.test(x) && !/^(b\.?v\.?|de|het|van|en|&)$/i.test(x));
  return ((w[0]||'?')[0] + (w[1] ? w[1][0] : (w[0]||'')[1]||'')).toUpperCase();
}
const mono = (b, cls='') => `<span class="mono k-${b.kopje} ${cls}" aria-hidden="true">${esc(initialen(b.naam))}</span>`;
function groet(){ const h = new Date().getHours(); return h < 12 ? 'Goedemorgen' : h < 18 ? 'Goedemiddag' : 'Goedenavond'; }

  const straks = taken.filter(t => t.soort==='opvolg' && !t.s.due && !t.s.gepauzeerd && t.datum <= addDays(today(),7)).sort((a,b)=>a.datum.localeCompare(b.datum));
  const n = k => S.bedrijven.filter(b => b.kopje===k).length;

  const kaart = t => {

    <section class="section">

      ${nu.length ? `<div class="tasks">${nu.map(kaart).join('')}</div>` : `<div class="empty">${ic('check')}<p>Niets openstaand. Leg een bezoek vast om een opvolging te starten.</p><button class="btn primary" data-act="nieuw">${ic('plus','sm')}Nieuw bedrijf</button></div>`}

  return `<div class="wrap">

function meerView(){
  const t = S.inst.termijnen;
  const veld = (k, key, label, suffix) => `<label class="f"><span>${label}</span><input type="number" min="0" id="t-${k}-${key}" name="${k}.${key}" value="${esc(t[k][key])}" inputmode="numeric"><span class="hint">${suffix}</span></label>`;
  const blok = k => `<fieldset class="card" style="margin:0"><legend class="eyebrow" style="padding:0 4px">${KOPJES[k].naam}</legend>
    <div class="grid2">${veld(k,'opvolgWerkdagen','Eerste opvolging na','werkdagen na het bezoek')}${veld(k,'geenReactieDagen','Geen reactie na','dagen na een mail')}
    ${veld(k,'nietOpgenomenWerkdagen','Niet opgenomen, opnieuw na','werkdagen')}${veld(k,'maxPogingen','Maximaal aantal pogingen','daarna kies je hoe verder')}
    ${k==='commissie'?veld(k,'betaaltermijnDagen','Betaaltermijn commissie','dagen na factureren'):''}</div></fieldset>`;
  // eenvoudige cijfers: conversie per tag
  const perTag = new Map();
  S.bedrijven.filter(b => b.kopje==='prospect' || (b.kopje==='klant' && b.wasProspect)).forEach(b => (b.tags||['(geen tag)']).forEach(tag => {
    const r = perTag.get(tag) || {tot:0, klant:0}; r.tot++; if(b.kopje==='klant') r.klant++; perTag.set(tag, r);
  }));
  return `<div class="wrap">
    <header class="page-head"><p class="eyebrow">Instellingen en overzicht</p><h1>Meer</h1></header>
    <div class="btns"><button class="btn" data-act="tab" data-tab="alle">${ic('search','sm')}Zoeken in alle kopjes</button></div>
    <section class="section"><div class="section-title"><h2>Conversie per tag</h2></div>
      ${perTag.size ? `<div class="card scroll-x"><table class="mini"><thead><tr><th>Tag</th><th class="r">Prospects</th><th class="r">Klant geworden</th><th class="r">Conversie</th></tr></thead><tbody>
      ${[...perTag.entries()].sort((a,b)=>b[1].tot-a[1].tot).map(([tag,r])=>`<tr><td>${esc(tag)}</td><td class="r">${r.tot}</td><td class="r">${r.klant}</td><td class="r">${Math.round(r.klant/r.tot*100)}%</td></tr>`).join('')}
      </tbody></table></div>` : `<p class="sub">Komt hier zodra er prospects met tags zijn.</p>`}
    </section>
    <form id="inst-form" class="section">
      <div class="section-title"><h2>Termijnen</h2></div>
      <p class="sub">Werkdagen slaan weekenden en Nederlandse feestdagen over.</p>
      ${blok('prospect')}${blok('commissie')}${blok('klant')}
      <div class="section-title"><h2>Regio's</h2></div>
      <p class="sub">Eén regio per regel: naam, dan een dubbele punt en postcodereeksen. De eerste regel die past wint.</p>
      <label class="f"><span>Regio-indeling</span><textarea id="regios" name="regios" rows="5">${esc((S.inst.regios||[]).map(r=>`${r.naam}: ${r.postcodes}`).join('\n'))}</textarea></label>
      <div class="sheet-actions"><button class="btn primary" type="submit">Instellingen opslaan</button></div>
    </form>
    <section class="section"><div class="section-title"><h2>Exportlog</h2></div>
      ${S.exportlog.length ? `<div class="card scroll-x"><table class="mini"><thead><tr><th>Wanneer</th><th>Lijst</th><th>Filters</th><th class="r">Records</th></tr></thead><tbody>
      ${S.exportlog.slice(0,25).map(e=>`<tr><td>${esc(fmtTijd(e.datum))}</td><td>${esc(e.lijst)}</td><td>${esc(e.filters||'geen')}</td><td class="r">${e.aantal}</td></tr>`).join('')}</tbody></table></div>` : `<p class="sub">Nog geen exports.</p>`}
    </section>
    <section class="section"><div class="section-title"><h2>Nog niet gekoppeld</h2></div>
      <p class="note">Mail versturen en ontvangen via Microsoft 365, de Outlook-agenda, spraakmemo's en pushmeldingen komen later. Onder Mail stel je een mail op vanuit een sjabloon, open je hem in je mailprogramma en leg je hem vast. Een antwoord leg je vast met "Reactie". De opvolging telt beide mee.</p>
    </section>
    ${S.gebruiker?.admin ? beheerView() : ''}
    <section class="section"><div class="section-title"><h2>Account</h2></div>
      <p class="sub">Ingelogd als ${esc(S.gebruiker?.naam||'')}${S.gebruiker?.admin?' (beheerder)':''}</p>
      <div class="btns"><a class="btn" href="https://github.com/${esc(window.DESKO_CONFIG?.DATA_REPO||'')}/commits/main" target="_blank" rel="noopener">Wijzigingsgeschiedenis</a><button class="btn" data-act="wachtwoord">Wachtwoord wijzigen</button><button class="btn" data-act="uitloggen">Uitloggen</button></div>
    </section>
  </div>`;
}

/* ---------- render ---------- */
function render(){
  const a = document.activeElement, id = a?.id, pos = a?.selectionStart;
  let html;
  if(S.geenDb) html = `<div class="wrap"><h1>Desko CRM</h1><div class="empty"><p>De opslag is niet ingesteld. Vul DATA_REPO in config.js in (zie de README).</p></div></div>`;
  else if(!S.gebruiker && !S.laden) html = S.gebruikers && !S.gebruikers.length ? setupView() : loginView();
  else if(S.laden) html = `<div class="auth"><div class="auth-box">${LOGO}<p class="lead">Gegevens laden…</p></div></div>`;
  else if(V.detail) html = detailView(bedrijf(V.detail));
  else if(V.tab==='vandaag') html = vandaagView();
  else if(V.tab==='meer') html = meerView();
  else if(V.tab==='mail') html = mailView();
  else html = lijstView(V.tab);
  $('#app').innerHTML = html;
  const nuAantal = S.bedrijven.filter(b => opvolgStatus(b)?.due).length + commissieTaken().length;
  const tabs = [['vandaag','sun','Vandaag'],['klant','building','Klanten'],['prospect','target','Prospects'],['commissie','euro','Commissie'],['mail','mail','Mail'],['meer','menu','Meer']];
  const actief = k => !V.detail ? (V.tab===k || (k==='meer'&&V.tab==='alle')) : (k===V.terugNaar);
  $('#tabs').innerHTML = tabs.map(([k,i,l]) => `<button data-act="tab" data-tab="${k}" ${actief(k)?'aria-current="page"':''}><span class="pill">${ic(i)}</span><span>${l}</span>${k==='vandaag'&&nuAantal?`<span class="badge num">${nuAantal}</span>`:''}</button>`).join('');
  const ingelogd = !S.geenDb && !!S.gebruiker;
  const ini = esc(initialen(S.gebruiker?.naam||''));
  $('#side-brand').innerHTML = `${LOGO}`;
  $('#side-foot').innerHTML = ingelogd ? `<span class="avatar">${ini}</span><span>${esc(S.gebruiker.naam)}</span>` : '';
  $('#topbar').innerHTML = `<div class="in">${LOGO}${ingelogd?`<button class="avatar" data-act="tab" data-tab="meer" aria-label="Account en instellingen">${ini}</button>`:''}</div>`;
  $('#topbar').hidden = !ingelogd || S.laden;
  $('#fab').innerHTML = `${ic('plus')}Nieuw`;
  $('#fab').hidden = S.laden || !ingelogd || !!V.detail || V.tab==='meer' || V.tab==='mail';
  $('nav.tabs').hidden = !ingelogd;
  if(id){ const el = document.getElementById(id); if(el && el!==document.activeElement){ el.focus(); try{ if(pos!=null) el.setSelectionRange(pos,pos); }catch{} } }
  const form = $('#inst-form'); if(form) form.onsubmit = bewaarInstellingen;
  const lf = $('#login-form'); if(lf) lf.onsubmit = inloggen;
  const sf = $('#setup-form'); if(sf) sf.onsubmit = eersteKeer;
  const bf = $('#gebruiker-form'); if(bf) bf.onsubmit = gebruikerToevoegen;
}

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden=true, 2400); }
async function veilig(fn, ok){
  try{ await fn(); if(ok) toast(ok); return true; }
  catch(e){ console.error(e); toast(e?.code==='quota_exceeded' ? 'Opslag is vol. Verwijder oude gegevens.' : 'Opslaan lukte niet. Probeer het opnieuw.'); return false; }
}

/* ---------- sheets ---------- */
function openSheet(title, body, onMount){
  const w = $('#sheet');
  w.innerHTML = `<div class="sheet-backdrop" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button class="icon-btn" data-act="closeSheet" aria-label="Sluiten">${ic('x')}</button></div><div class="sheet-body">${body}</div></div>`;
  w.hidden = false;
  onMount && onMount(w.querySelector('.sheet'));
  const first = w.querySelector('input:not([type=hidden]):not([type=radio]):not([type=checkbox]),textarea,select'); first && first.focus({preventScroll:true});
}
function closeSheet(){ const w = $('#sheet'); w.hidden = true; w.innerHTML = ''; }
function bevestig(title, tekst, knop, fn){
  openSheet(title, `<p>${esc(tekst)}</p><div class="sheet-actions"><button class="btn" data-act="closeSheet">Annuleren</button><button class="btn danger" id="bev-ok">${esc(knop)}</button></div>`,
    s => s.querySelector('#bev-ok').onclick = async () => { closeSheet(); await fn(); });
}
const formData = form => Object.fromEntries(new FormData(form).entries());

function tagField(waarde){
  return `<label class="f"><span>Tags</span><input id="tags-in" name="tags" value="${esc(waarde.join(', '))}" placeholder="bijv. door to door" autocomplete="off"><span class="hint">Scheid tags met een komma.</span></label><div class="sugg" id="tag-sugg"></div>`;
}
function mountTags(s){
  const inp = s.querySelector('#tags-in'), box = s.querySelector('#tag-sugg'); if(!inp) return;
  const upd = () => {
    const delen = inp.value.split(','), laatste = delen[delen.length-1].trim().toLowerCase();
    const al = new Set(delen.map(x=>x.trim().toLowerCase()));
    const opties = alleTags().filter(t => !al.has(t.toLowerCase()) && (!laatste || t.toLowerCase().includes(laatste))).slice(0,8);
    box.innerHTML = opties.map(t => `<button type="button" data-tag="${esc(t)}">+ ${esc(t)}</button>`).join('');
  };
  box.onclick = e => { const t = e.target.closest('[data-tag]'); if(!t) return;
    const delen = inp.value.split(',').map(x=>x.trim()); delen[delen.length-1] = t.dataset.tag; inp.value = delen.filter(Boolean).join(', ') + ', '; inp.focus(); upd(); };
  inp.oninput = upd; upd();
}
function contactSelect(b, ci, id='ci'){
  const cs = b.contacten||[];
  if(!cs.length) return '';
  return `<label class="f"><span>Contactpersoon</span><select id="${id}" name="ci">${cs.map((c,i)=>`<option value="${i}" ${String(i)===String(ci??0)?'selected':''}>${esc(c.naam)}${c.functie?' – '+esc(c.functie):''}</option>`).join('')}</select></label>`;
}

}

function actForm(b, type, ci){

    ${contactSelect(b, ci ?? b.opvolging?.contact)}
    ${type==='bezoek' ? `<details ${(b.contacten||[]).length?'':'open'}><summary class="sub" style="cursor:pointer">Nieuwe contactpersoon toevoegen</summary><div class="section" style="padding-top:10px">
      <div class="grid2"><label class="f"><span>Naam</span><input id="af-cnaam" name="cnaam" autocomplete="off"></label><label class="f"><span>Functie</span><input id="af-cfunctie" name="cfunctie" placeholder="bijv. Facilitair manager" autocomplete="off"></label></div>
      <div class="grid2"><label class="f"><span>Telefoon</span><input id="af-ctel" name="ctel" type="tel" autocomplete="off"></label><label class="f"><span>E-mail</span><input id="af-cmail" name="cmail" type="email" autocomplete="off"></label></div>

    ${type==='afspraak' ? `<label class="f"><span>Datum en tijd van de afspraak</span><input id="af-op" name="afspraakOp" type="datetime-local" value="${localDT(new Date(Date.now()+86400000))}"></label>` : ''}

    ${type==='bezoek' ? tagField(b.tags||[]) : ''}
    ${type==='bezoek' ? reeksKeuze(b, 'af') : ''}
    ${reeksMogelijk ? `<label class="check"><input type="checkbox" id="af-reeks" name="reeks" checked><span>Opvolging starten</span></label>` : ''}
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">Opslaan</button></div>
  </form>`, s => {
    if(type==='bezoek') mountTags(s);
    s.querySelector('#af').onsubmit = async e => {
      e.preventDefault(); const d = formData(e.target);
      const ok = await veilig(async () => {
        let bb = b, idx = d.ci!=null ? Number(d.ci) : 0;
        if(type==='bezoek'){
          const patch = {};
          if(d.cnaam?.trim()){
            const lijst = clone(b.contacten||[]); lijst.push({naam:d.cnaam.trim(), functie:d.cfunctie.trim(), afdeling:'', telefoon:d.ctel.trim(), email:d.cmail.trim()});
            patch.contacten = lijst; idx = lijst.length-1;
          }
          let tags = normTags(String(d.tags||'').split(','));
          if(d.mailreeks !== undefined) tags = tagsMetReeks(tags, d.mailreeks);
          if(JSON.stringify(tags)!==JSON.stringify(b.tags||[])) patch.tags = tags;
          if(Object.keys(patch).length){ await updBedrijf(b.id, patch); bb = {...b, ...patch}; }
        }
        const c = contactVan(bb, idx);

        if(type==='afspraak' && d.afspraakOp) a.afspraakOp = new Date(d.afspraakOp).toISOString();
        await verwerkActiviteit(bb, a, {startReeks: !!d.reeks && !!c, contact: idx});
      }, 'Vastgelegd');
      if(ok) closeSheet();
    };
  });
}

          await systeem(b, `Vervolgactie gepland op ${fmtDag(d.actieDatum)}: ${d.actie.trim()}.`);

/* ---------- mail ---------- */
const sjablonenVoor = kopje => (S.inst.sjablonen||[]).filter(t => !t.kopje || t.kopje==='alle' || t.kopje===kopje);
function standaardSjabloon(b){
  const lijst = sjablonenVoor(b.kopje);
  if(b.kopje==='prospect' && (b.opvolging?.pogingen||0) > 0) return lijst.find(t => t.id==='prospect-herinnering') || lijst[0];
  return lijst[0];
}

function mailOpstellen(b, ci){
  const kies = !b;
  const metMail = S.bedrijven.filter(x => (x.contacten||[]).some(c => c.email)).sort((x,y) => x.naam.localeCompare(y.naam));
  openSheet('Mail opstellen', `<form id="mo" class="section">
    ${kies ? `<label class="f"><span>Bedrijf</span><select id="mo-b" required><option value="">Kies een bedrijf…</option>${metMail.map(x=>`<option value="${x.id}">${esc(x.naam)} (${KOPJES[x.kopje].enk.toLowerCase()})</option>`).join('')}</select></label>` : ''}
    <p class="hint">Al verstuurd vanuit Outlook? <a href="#" data-act="mailHandmatig" data-richting="uit" ${b?`data-id="${b.id}"`:''}>Leg hem hier vast</a>.</p>
    <div id="mo-aan"></div>
    <label class="f"><span>Sjabloon</span><select id="mo-sj"></select></label>
    <label class="f"><span>Onderwerp</span><input id="mo-ond" name="onderwerp" required autocomplete="off"></label>
    <label class="f"><span>Bericht</span><textarea id="mo-tekst" name="tekst" required style="min-height:280px"></textarea></label>
    <p class="hint">${robotActief() ? 'Versturen gaat vanuit je eigen mailbox, binnen een kwartier. De mail komt daarna vanzelf in de tijdlijn.' : 'Klik op "Open in mail" om hem in je mailprogramma te versturen. Klik daarna op "Markeer als verstuurd", dan komt hij in de tijdlijn.'}</p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="mo-kopie">${ic('note','sm')}Kopieer tekst</button>
      <a class="btn" id="mo-open" href="#">${ic('mail','sm')}Open in mail</a>
      <button class="btn primary" type="submit" id="mo-ok">${ic('check','sm')}${robotActief() ? 'Versturen' : 'Markeer als verstuurd'}</button>
    </div>
  </form>`, s => {
    let cur = b, bewerkt = false;
    const $s = q => s.querySelector(q), ond = $s('#mo-ond'), tekst = $s('#mo-tekst'), sj = $s('#mo-sj');
    const contact = () => cur ? contactVan(cur, Number($s('#mo-ci')?.value ?? 0)) : null;
    const link = () => {
      const c = contact(), a = $s('#mo-open');
      if(a) a.href = c?.email ? `mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(ond.value)}&body=${encodeURIComponent(tekst.value)}` : '#';
    };
    const pasToe = () => {
      const t = (S.inst.sjablonen||[]).find(x => x.id === sj.value);
      if(t && cur){ ond.value = REEKS.vul(t.onderwerp, cur, contact(), S.gebruiker?.naam); tekst.value = REEKS.vul(t.tekst, cur, contact(), S.gebruiker?.naam); bewerkt = false; }
      link();
    };
    const kiesBedrijf = () => {
      const cs = cur?.contacten || [];
      const start = ci ?? cur?.opvolging?.contact ?? Math.max(0, cs.findIndex(c => c.email));
      $s('#mo-aan').innerHTML = cur ? `<label class="f"><span>Aan</span><select id="mo-ci">${cs.map((c,i)=>`<option value="${i}" ${i===start?'selected':''} ${c.email?'':'disabled'}>${esc(c.naam)} · ${esc(c.email||'geen e-mailadres')}</option>`).join('')}</select></label>` : '';
      const lijst = cur ? sjablonenVoor(cur.kopje) : [];
      const std = cur && standaardSjabloon(cur);
      sj.innerHTML = lijst.map(t => `<option value="${esc(t.id)}" ${t===std?'selected':''}>${esc(t.naam)}</option>`).join('') + '<option value="">Leeg bericht</option>';
      const sel = $s('#mo-ci'); if(sel) sel.onchange = () => { if(!bewerkt) pasToe(); else link(); };
      pasToe();
    };
    if(kies) $s('#mo-b').onchange = e => { cur = bedrijf(e.target.value); ci = undefined; kiesBedrijf(); };
    sj.onchange = () => { if(!sj.value){ ond.value=''; tekst.value=''; } pasToe(); };
    ond.oninput = tekst.oninput = () => { bewerkt = true; link(); };
    $s('#mo-kopie').onclick = () => navigator.clipboard?.writeText(`${ond.value}\n\n${tekst.value}`).then(() => toast('Tekst gekopieerd'), () => toast('Kopiëren lukte niet'));
    kiesBedrijf();
    $s('#mo').onsubmit = async e => {
      e.preventDefault();
      const c = contact();
      if(!cur || !c?.email){ toast('Kies een contactpersoon met een e-mailadres.'); return; }
      const ok = await veilig(async () => {
        await annuleerGepland(cur, 'je stuurde zelf een mail');
        const mail = {bedrijfId:cur.id, bedrijf:cur.naam, kopje:cur.kopje, contact:Number($s('#mo-ci')?.value ?? 0), aan:c.naam, email:c.email,
          onderwerp:ond.value, tekst:tekst.value, sjabloon:sj.value, afzender:S.gebruiker?.naam||'', door:S.gebruiker?.naam||'', aangemaakt:new Date().toISOString()};
        if(robotActief()){
          const nu = new Date();
          await db.collection('mails').add({...mail, status:'gepland', handmatig:true, datum:today(), tijd:`${pad(nu.getHours())}:${pad(nu.getMinutes())}`});
        } else {
          await db.collection('mails').add({...mail, status:'verstuurd', handmatig:true, datum:new Date().toISOString(), verstuurdOp:new Date().toISOString()});
          await verwerkActiviteit(cur, {type:'mail_uit', contactNaam:c.naam, aan:c.email, onderwerp:ond.value, tekst:`Onderwerp: ${ond.value}\n\n${tekst.value}`});
        }
      }, robotActief() ? 'Mail wordt binnen een kwartier verstuurd' : 'Mail vastgelegd');
      if(ok) closeSheet();
    };
  });
}

/* Mailen: het eigen mailprogramma opent direct met de tekst erin; daarna vastleggen. */
function mailtoLink(email, onderwerp, tekst){
  return `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(onderwerp||'')}&body=${encodeURIComponent(tekst||'')}`;
}
function openMailprogramma(href){ const a = document.createElement('a'); a.href = href; document.body.appendChild(a); a.click(); a.remove(); }
function mailen(b, ci, m){
  let c;
  if(m) c = {naam:m.aan, email:m.email};
  else {
    const cs = b.contacten || [];
    const start = ci ?? b.opvolging?.contact ?? 0;
    c = cs[start]?.email ? cs[start] : cs.find(x => x.email);
    ci = cs.indexOf(c);
  }
  if(!c?.email){ toast('Deze contactpersoon heeft nog geen e-mailadres. Voeg het toe bij Contactpersonen.'); return; }
  let onderwerp = m?.onderwerp || '', tekst = m?.tekst || '', sjabloon = m?.sjabloon || '';
  if(!m){ const t = standaardSjabloon(b); if(t){ onderwerp = REEKS.vul(t.onderwerp, b, c, S.gebruiker?.naam); tekst = REEKS.vul(t.tekst, b, c, S.gebruiker?.naam); sjabloon = t.id; } }
  const href = mailtoLink(c.email, onderwerp, tekst);
  openMailprogramma(href);
  openSheet('Mail verstuurd?', `<div class="section">
    <p>Je mailprogramma is geopend met een mail aan <b>${esc(c.naam)}</b> (${esc(c.email)}). Pas hem aan als je wilt en verstuur hem daar.</p>
    <p class="sub">Onderwerp: ${esc(onderwerp || '(leeg)')}</p>
    <p class="hint">Opende er niets? <a href="${esc(href)}">Probeer het opnieuw</a> of kopieer de tekst en plak hem in je mail.</p>
    <div class="sheet-actions">
      <button type="button" class="btn" id="mv-kopie">${ic('note','sm')}Kopieer tekst</button>
      <button type="button" class="btn" data-act="closeSheet">Nog niet verstuurd</button>
      <button type="button" class="btn primary" id="mv-ja">${ic('check','sm')}Ja, verstuurd</button>
    </div></div>`, s => {
    s.querySelector('#mv-kopie').onclick = () => navigator.clipboard?.writeText(`${onderwerp}\n\n${tekst}`).then(() => toast('Tekst gekopieerd'), () => toast('Kopiëren lukte niet'));
    s.querySelector('#mv-ja').onclick = async () => {
      const ok = await veilig(async () => {
        if(m) return markeerVerstuurd(m);
        await annuleerGepland(b, 'je stuurde zelf een mail');
        const nu = new Date().toISOString();
        await db.collection('mails').add({status:'verstuurd', handmatig:true, bedrijfId:b.id, bedrijf:b.naam, kopje:b.kopje, contact:ci, aan:c.naam, email:c.email,
          onderwerp, tekst, sjabloon, afzender:S.gebruiker?.naam||'', door:S.gebruiker?.naam||'', aangemaakt:nu, datum:nu, verstuurdOp:nu});
        await verwerkActiviteit(b, {type:'mail_uit', contactNaam:c.naam, aan:c.email, onderwerp, tekst:`Onderwerp: ${onderwerp}\n\n${tekst}`});
      }, 'Mail vastgelegd');
      if(ok) closeSheet();
    };
  });
}

    <div class="grid2"><label class="f"><span>Verzenddatum</span><input id="gm-datum" name="datum" type="date" value="${esc(m.datum)}" min="${today()}"></label>
      <label class="f"><span>Tijd</span><input id="gm-tijd" name="tijd" type="time" value="${esc(m.tijd||'09:30')}"></label></div>
    <label class="f"><span>Onderwerp</span><input id="gm-ond" name="onderwerp" required value="${esc(m.onderwerp)}" autocomplete="off"></label>

      <button class="btn ${auto?'primary':''}" type="submit">Wijzigingen opslaan</button>
    </div>
  </form>`, s => {
    const $s = q => s.querySelector(q), ond = $s('#gm-ond'), tekst = $s('#gm-tekst');
    const open = $s('#gm-open');
    if(open) open.onclick = e => { e.preventDefault(); const w = wijzig(); closeSheet(); mailen(bedrijf(m.bedrijfId), m.contact, {...m, ...w}); };
    const link = () => { const a = $s('#gm-open'); if(a) a.href = `mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent(ond.value)}&body=${encodeURIComponent(tekst.value)}`; };
    ond.oninput = tekst.oninput = link; link();
    const wijzig = () => ({onderwerp:ond.value, tekst:tekst.value, datum:$s('#gm-datum').value || m.datum, tijd:$s('#gm-tijd').value || m.tijd});
    $s('#gm').onsubmit = async e => {
      e.preventDefault(); const w = wijzig();
      if(await veilig(async () => {
        await db.collection('mails').doc(m.id).update(w);

      }, 'Mail bijgewerkt')) closeSheet();
    };
    $s('#gm-weg').onclick = () => bevestig('Mail niet versturen', `De mail aan ${m.aan} wordt geannuleerd. Je krijgt in plaats daarvan een herinnering om zelf contact op te nemen.`, 'Niet versturen', () => veilig(async () => {
      await db.collection('mails').doc(m.id).update({status:'geannuleerd', reden:'handmatig geannuleerd', geannuleerdOp:new Date().toISOString()});
      await systeem(b, `Ingeplande mail "${m.onderwerp}" geannuleerd.`);
      if(b.opvolging?.actief && b.opvolging.stap==='mail') await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), stap:'eerste', datum:today()}});
    }, 'Mail geannuleerd'));
    const klaar = $s('#gm-klaar');
    if(klaar) klaar.onclick = async () => { if(await veilig(() => markeerVerstuurd(m, wijzig()), 'Mail vastgelegd als verstuurd')) closeSheet(); };
  });

/* Een ingeplande mail is (handmatig) verstuurd: vastleggen, opvolging bijwerken en de volgende reeksmail inplannen. */
async function markeerVerstuurd(m, w = {}){
  const b = bedrijf(m.bedrijfId);
  const nu = new Date().toISOString();
  const mail = {...m, ...w};
  await db.collection('mails').doc(m.id).update({...w, status:'verstuurd', verstuurdOp:nu});
  await logAct(b, {type:'mail_uit', contactNaam:mail.aan, aan:mail.email, onderwerp:mail.onderwerp, tekst:`Onderwerp: ${mail.onderwerp}\n\n${mail.tekst}`});
  await updBedrijf(b.id, {laatsteContact:today()});
  const {opvolging, volgende} = REEKS.naVerzending(b, mail, S.inst, today());
  if(volgende) await db.collection('mails').add(volgende);
  await updBedrijf(b.id, {opvolging});
  await systeem(b, volgende ? `Mail ${mail.stap+1} verstuurd. Mail ${volgende.stap+1} ("${volgende.onderwerp}") ingepland voor ${fmtDag(volgende.datum)} als er geen reactie komt.` : `Mail verstuurd. Geen reactie voor ${fmtDag(opvolging.datum)}? Dan krijg je een herinnering om te bellen of te mailen.`);
}

/* Handmatig een verstuurde of ontvangen mail vastleggen (bijv. vanuit Outlook). */
function mailHandmatig(richting, b){
  const uit = richting==='uit';
  const lijst = S.bedrijven.slice().sort((x,y) => x.naam.localeCompare(y.naam));
  openSheet(uit ? 'Verstuurde mail vastleggen' : 'Ontvangen mail vastleggen', `<form id="mh" class="section">
    ${b ? `<p class="sub">${esc(b.naam)}</p>` : `<label class="f"><span>Bedrijf</span><select id="mh-b" required><option value="">Kies een bedrijf…</option>${lijst.map(x=>`<option value="${x.id}">${esc(x.naam)}</option>`).join('')}</select></label>`}
    <div id="mh-aan"></div>
    <label class="f"><span>${uit?'Verstuurd op':'Ontvangen op'}</span><input id="mh-datum" name="datum" type="datetime-local" required value="${localDT()}"></label>
    <label class="f"><span>Onderwerp</span><input id="mh-ond" name="onderwerp" required autocomplete="off"></label>
    <label class="f"><span>${uit?'Inhoud of samenvatting':'Wat schreef de contactpersoon?'}</span><textarea id="mh-tekst" name="tekst"></textarea></label>
    ${uit ? '' : '<p class="hint">Een ontvangen mail telt als reactie: de opvolging stopt en ingeplande mails gaan niet meer.</p>'}
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">Vastleggen</button></div>
  </form>`, s => {
    let cur = b;
    const zetAan = () => { const cs = cur?.contacten||[]; s.querySelector('#mh-aan').innerHTML = cs.length ? contactSelect(cur, cur.opvolging?.contact ?? 0, 'mh-ci') : (cur ? '<p class="hint">Dit bedrijf heeft nog geen contactpersoon.</p>' : ''); };
    const sel = s.querySelector('#mh-b'); if(sel) sel.onchange = e => { cur = bedrijf(e.target.value); zetAan(); };
    zetAan();
    s.querySelector('#mh').onsubmit = async e => {
      e.preventDefault(); const d = formData(e.target);
      if(!cur){ toast('Kies een bedrijf.'); return; }
      const c = contactVan(cur, Number(d.ci ?? 0)), datum = new Date(d.datum).toISOString();
      const ok = await veilig(async () => {
        const basis = {bedrijfId:cur.id, bedrijf:cur.naam, kopje:cur.kopje, contact:Number(d.ci ?? 0), aan:c?.naam||'', email:c?.email||'', onderwerp:d.onderwerp.trim(), tekst:d.tekst.trim(), handmatig:true, vastgelegd:true, door:S.gebruiker?.naam||'', aangemaakt:new Date().toISOString()};
        if(uit){
          await annuleerGepland(cur, 'je stuurde zelf een mail');
          await db.collection('mails').add({...basis, status:'verstuurd', datum, verstuurdOp:datum});
          await verwerkActiviteit(cur, {type:'mail_uit', datum, contactNaam:c?.naam||'', onderwerp:basis.onderwerp, tekst:`Onderwerp: ${basis.onderwerp}${basis.tekst?'\n\n'+basis.tekst:''}`});
        } else {
          await db.collection('mails').add({...basis, status:'ontvangen', datum, verstuurdOp:datum});
          await verwerkActiviteit(cur, {type:'mail_in', datum, contactNaam:c?.naam||'', onderwerp:basis.onderwerp, tekst:`Onderwerp: ${basis.onderwerp}${basis.tekst?'\n\n'+basis.tekst:''}`});
        }
      }, uit ? 'Verstuurde mail vastgelegd' : 'Ontvangen mail vastgelegd');
      if(ok) closeSheet();
    };
  });
}

/* Zoeken op bedrijf, contactpersoon, e-mail of plaats en direct mailen. */
function mailZoekResultaten(q){
  const woorden = q.toLowerCase().split(/\s+/).filter(Boolean);
  const treffers = [];
  for(const b of S.bedrijven){
    (b.contacten||[]).forEach((c, i) => {
      const hooi = [b.naam, b.plaats, c.naam, c.email, c.functie, ...(b.tags||[])].join(' ').toLowerCase();
      if(woorden.every(w => hooi.includes(w))) treffers.push({b, c, i});
    });
  }
  treffers.sort((x,y) => x.b.naam.localeCompare(y.b.naam));
  if(!treffers.length) return `<div class="empty">${ic('search')}<p>Niets gevonden voor "${esc(q)}".</p></div>`;
  return `<div class="rows">${treffers.slice(0,15).map(({b,c,i}) => `<div class="row static" style="grid-template-columns:auto 1fr auto">
    ${mono(b)}<span class="t"><span class="row-top"><b>${esc(b.naam)}</b>${chipKopje(b.kopje)}</span>
      <span class="meta">${esc(c.naam)}${c.functie?' · '+esc(c.functie):''} · ${c.email?esc(c.email):'geen e-mailadres'}</span></span>
    <span class="btns" style="flex-wrap:nowrap">${c.email
      ? `<button class="btn small primary" data-act="mailen" data-id="${b.id}" data-ci="${i}" aria-label="${esc(c.naam)} mailen">${ic('mail','sm')}<span class="lbl">Mailen</span></button><button class="btn small" data-act="mail" data-id="${b.id}" data-ci="${i}" aria-label="Mail opstellen met sjabloon">${ic('note','sm')}<span class="lbl">Opstellen</span></button>`
      : `<button class="btn small" data-act="open" data-id="${b.id}">Openen</button>`}</span></div>`).join('')}</div>
    ${treffers.length > 15 ? `<p class="hint">${treffers.length - 15} meer. Typ verder om te verfijnen.</p>` : ''}`;
}

function tagsMetReeks(tags, reeksId){
  const reeksen = S.inst.mailreeksen || [], gekozen = reeksen.find(r => r.id===reeksId);

  const uit = tags.filter(t => !reeksTags.has(t.toLowerCase()));
  if(gekozen) uit.push(gekozen.tag);
  return uit;
}

function exportSheet(kopje){
  const lijst = gefilterd(kopje);
  openSheet('Exporteren', `<form id="ex" class="section">
    <p class="sub num">${lijst.length} ${lijst.length===1?'bedrijf':'bedrijven'} uit ${kopje==='alle'?'alle kopjes':KOPJES[kopje].naam}, met de huidige zoekopdracht en filters. Exports worden gelogd.</p>
    <div class="f"><span>Kolommen</span><div class="cols">${KOLOMMEN.map(([k,l,,aan])=>`<label class="check"><input type="checkbox" name="kol" value="${k}" id="kol-${k}" ${aan||(kopje==='commissie'&&k.startsWith('c'))?'checked':''}><span>${l}</span></label>`).join('')}</div></div>
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button type="submit" class="btn" value="csv">CSV</button><button type="submit" class="btn primary" value="xlsx">Excel (.xlsx)</button></div>
  </form>`, s => {
    s.querySelector('#ex').onsubmit = async e => {
      e.preventDefault();
      const fmt = e.submitter?.value || 'xlsx';
      const gekozen = new Set([...s.querySelectorAll('input[name=kol]:checked')].map(i=>i.value));
      const kols = KOLOMMEN.filter(k => gekozen.has(k[0]));
      if(!kols.length){ toast('Kies minstens één kolom.'); return; }
      const rijen = [kols.map(k=>k[1]), ...lijst.map(b => kols.map(k => k[2](b) ?? ''))];
      const naam = `desko-${kopje}-${today()}.${fmt}`;
      let data;
      if(fmt==='csv'){
        const cel = v => { const t = String(v); return /[;"\n\r]/.test(t) ? `"${t.replace(/"/g,'""')}"` : t; };
        data = '﻿' + rijen.map(r => r.map(cel).join(';')).join('\r\n');
      } else {
        if(!window.XLSX){ toast('Excel is niet beschikbaar. Kies CSV.'); return; }
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rijen), 'Export');
        data = new Uint8Array(XLSX.write(wb, {type:'array', bookType:'xlsx'}));
      }
      try{
        bewaarBestand(naam, data, fmt==='csv' ? 'text/csv;charset=utf-8' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        const f = V.filters[kopje] || {};
        const filt = [V.zoek[kopje] && `zoek "${V.zoek[kopje]}"`, ...Object.entries(f).filter(([,v])=>v).map(([k,v])=>`${k}=${v}`)].filter(Boolean).join(', ');
        await db.collection('exportlog').add({datum:new Date().toISOString(), lijst:kopje==='alle'?'Alle':KOPJES[kopje].naam, door:S.gebruiker?.naam||'', filters:filt, kolommen:kols.map(k=>k[1]).join(', '), aantal:lijst.length, formaat:fmt});
        closeSheet(); toast('Export klaar');
      }catch(err){ console.error(err); toast('Exporteren lukte niet.'); }
    };
  });
}

function bewaarBestand(naam, data, type){
  const url = URL.createObjectURL(new Blob([data], {type}));
  const a = document.createElement('a'); a.href = url; a.download = naam; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}

async function eersteKeer(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  const waarden = {naam:d.naam, email:d.email};
  if(d.wachtwoord !== d.wachtwoord2){ S.login = {waarden, fout:'De wachtwoorden zijn niet gelijk.'}; render(); return; }
  S.login = {waarden, bezig:true}; render();
  try{
    const token = d.token.trim(), cfg = CFG();
    await controleerToegang(cfg.DATA_REPO, token);
    await controleerToegang(cfg.SITE_REPO, token);
    const g = await AUTH.maakGebruiker({naam:d.naam.trim(), email:d.email, wachtwoord:d.wachtwoord, admin:true, token});
    const huidig = await leesGebruikers(token);
    if(huidig.lijst.length) throw new Error('Er bestaat al een beheerder. Log in.');
    await schrijfGebruikers(token, [g], huidig.sha, `Beheerder ${g.naam} aangemaakt`);
    const sessie = {token, naam:g.naam, admin:true, id:g.id};
    bewaar(SESSIE_KEY, JSON.stringify(sessie));
    S.login = {}; S.gebruikers = [g]; start(sessie);
  }catch(err){ S.login = {waarden, fout:err.message.replace(/^Deze code/, 'Deze sleutel')}; render(); }
}

/* gebruikers.json in de website-repository lezen en schrijven (alleen beheerders). */
const GEBRUIKERS_PAD = 'site/gebruikers.json';
async function leesGebruikers(token){
  const r = await fetch(`https://api.github.com/repos/${CFG().SITE_REPO}/contents/${GEBRUIKERS_PAD}`, {cache:'no-store', headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'}});
  if(r.status === 404) return {lijst:[], sha:null};
  if(!r.ok) throw new Error(`Gebruikers ophalen lukte niet (${r.status}).`);
  const j = await r.json();
  return {lijst:JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')), c => c.charCodeAt(0)))).gebruikers || [], sha:j.sha};
}
async function schrijfGebruikers(token, lijst, sha, bericht){
  const inhoud = JSON.stringify({gebruikers:lijst}, null, 1) + '\n';
  const bytes = new TextEncoder().encode(inhoud); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  const r = await fetch(`https://api.github.com/repos/${CFG().SITE_REPO}/contents/${GEBRUIKERS_PAD}`, {method:'PUT', headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'},
    body:JSON.stringify({message:bericht, content:btoa(bin), ...(sha ? {sha} : {})})});
  if(r.status === 409) throw new Error('Iemand anders wijzigde tegelijk de gebruikers. Probeer het opnieuw.');
  if(!r.ok) throw new Error(`Opslaan lukte niet (${r.status}). Heeft de sleutel schrijfrechten op ${CFG().SITE_REPO}?`);
  return (await r.json()).content.sha;
}

let beheerLaden = false;
async function laadBeheer(){
  if(beheerLaden) return; beheerLaden = true;
  try{ S.beheer = await leesGebruikers(S.sessie.token); }
  catch(err){ S.beheer = {lijst:[], sha:null, fout:err.message}; }
  beheerLaden = false; render();
}
async function gebruikerToevoegen(e){
  e.preventDefault();
  const d = Object.fromEntries(new FormData(e.target).entries());
  S.beheer = {...S.beheer, bezig:true, fout:'', waarden:{naam:d.naam, email:d.email}}; render();
  try{
    const g = await AUTH.maakGebruiker({naam:d.naam.trim(), email:d.email, wachtwoord:d.wachtwoord, admin:!!d.admin, token:S.sessie.token});
    const {lijst, sha} = await leesGebruikers(S.sessie.token);
    const bestond = lijst.some(x => x.id === g.id);
    const nieuw = [...lijst.filter(x => x.id !== g.id), g];
    await schrijfGebruikers(S.sessie.token, nieuw, sha, bestond ? `Wachtwoord van ${g.naam} gewijzigd` : `Gebruiker ${g.naam} toegevoegd`);
    S.beheer = null; render();
    uitnodiging(g.naam, AUTH.normEmail(d.email), bestond);
  }catch(err){ S.beheer = {...S.beheer, bezig:false, fout:err.message}; render(); }
}
/* Tekst om naar een nieuwe collega te sturen. Het wachtwoord staat er bewust niet in. */
function uitnodiging(naam, email, bestond){
  const link = location.origin + location.pathname;
  const tekst = bestond
    ? `Hoi ${naam.split(' ')[0]},\n\nJe wachtwoord voor het Desko CRM is opnieuw ingesteld. Je nieuwe wachtwoord krijg je apart van mij.\n\nInloggen: ${link}\nE-mailadres: ${email}\n\nKies daarna een eigen wachtwoord via Meer → Account → Wachtwoord wijzigen.`
    : `Hoi ${naam.split(' ')[0]},\n\nJe hebt nu toegang tot het Desko CRM.\n\nInloggen: ${link}\nE-mailadres: ${email}\nJe wachtwoord krijg je apart van mij.\n\nKies na de eerste keer inloggen een eigen wachtwoord via Meer → Account → Wachtwoord wijzigen. Op je telefoon kun je de site via "Toevoegen aan beginscherm" als app gebruiken.`;
  openSheet(bestond ? 'Wachtwoord opnieuw ingesteld' : `${naam} is toegevoegd`, `<div class="section">
    <p>Stuur ${esc(naam.split(' ')[0])} deze tekst. Geef het wachtwoord apart door, bijvoorbeeld via een berichtje of telefonisch, niet in dezelfde mail.</p>
    <label class="f"><span>Uitnodiging</span><textarea id="uit-tekst" readonly style="min-height:220px">${esc(tekst)}</textarea></label>
    <p class="hint">Over ongeveer een minuut kan ${esc(naam.split(' ')[0])} inloggen.</p>
    <div class="sheet-actions">
      <a class="btn" href="${esc(mailtoLink(email, 'Toegang Desko CRM', tekst))}">${ic('mail','sm')}Mailen</a>
      <button type="button" class="btn primary" id="uit-kopie">${ic('note','sm')}Kopieer tekst</button>
    </div></div>`, s => {
    s.querySelector('#uit-kopie').onclick = () => navigator.clipboard?.writeText(tekst).then(() => toast('Uitnodiging gekopieerd'), () => { s.querySelector('#uit-tekst').select(); toast('Selecteer en kopieer de tekst'); });
  });
}

/* Eigen wachtwoord wijzigen: de sleutel opnieuw versleutelen met het nieuwe wachtwoord. */
function wachtwoordWijzigen(){
  openSheet('Wachtwoord wijzigen', `<form id="ww" class="section">
    <label class="f"><span>Je e-mailadres</span><input id="ww-email" name="email" type="email" required autocomplete="username"></label>
    <label class="f"><span>Huidig wachtwoord</span><input id="ww-oud" name="oud" type="password" required autocomplete="current-password"></label>
    <div class="grid2"><label class="f"><span>Nieuw wachtwoord</span><input id="ww-nieuw" name="nieuw" type="password" required minlength="10" autocomplete="new-password"></label>
    <label class="f"><span>Herhaal nieuw wachtwoord</span><input id="ww-nieuw2" name="nieuw2" type="password" required minlength="10" autocomplete="new-password"></label></div>
    <p class="hint">Minimaal 10 tekens. Een paar losse woorden is sterk en makkelijk te onthouden.</p>
    <p class="chip warn" id="ww-fout" hidden style="white-space:normal"></p>
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">Opslaan</button></div>
  </form>`, s => {
    const fout = t => { const f = s.querySelector('#ww-fout'); f.textContent = t; f.hidden = false; };
    s.querySelector('#ww').onsubmit = async e => {
      e.preventDefault(); const d = Object.fromEntries(new FormData(e.target).entries());
      if(d.nieuw !== d.nieuw2) return fout('De nieuwe wachtwoorden zijn niet gelijk.');
      try{
        const {lijst, sha} = await leesGebruikers(S.sessie.token);
        const ik = await AUTH.inloggen(lijst, d.email, d.oud).catch(() => null);
        if(!ik || ik.id !== S.sessie.id) return fout('E-mailadres of huidig wachtwoord klopt niet.');
        const oud = lijst.find(x => x.id === ik.id);
        const g = await AUTH.maakGebruiker({naam:oud.naam, email:d.email, wachtwoord:d.nieuw, admin:oud.admin, token:S.sessie.token});
        await schrijfGebruikers(S.sessie.token, lijst.map(x => x.id === g.id ? g : x), sha, `Wachtwoord van ${g.naam} gewijzigd door gebruiker`);
        closeSheet(); toast('Wachtwoord gewijzigd');
      }catch(err){ fout(err.message); }
    };
  });
}
async function gebruikerWeg(id){
  try{
    const {lijst, sha} = await leesGebruikers(S.sessie.token);
    const g = lijst.find(x => x.id === id);
    await schrijfGebruikers(S.sessie.token, lijst.filter(x => x.id !== id), sha, `Toegang van ${g?.naam||'gebruiker'} ingetrokken`);
    S.beheer = null; toast('Toegang ingetrokken'); render();
  }catch(err){ toast(err.message); }
}

/* ---------- instellingen ---------- */
async function bewaarInstellingen(e){
  e.preventDefault();
  const f = e.target, inst = clone(S.inst);
  f.querySelectorAll('input[type=number]').forEach(i => { const [k,key] = i.name.split('.'); inst.termijnen[k][key] = Math.max(0, parseInt(i.value,10)||0); });
  Object.values(inst.termijnen).forEach(t => { if(t.maxPogingen<1) t.maxPogingen = 1; });
  inst.regios = f.querySelector('#regios').value.split('\n').map(r => { const i = r.indexOf(':'); return i>0 ? {naam:r.slice(0,i).trim(), postcodes:r.slice(i+1).trim()} : null; }).filter(r => r && r.naam);
  await veilig(() => db.doc('instellingen/algemeen').set(inst), 'Instellingen opgeslagen');
}

/* ---------- navigatie ---------- */
function openDetail(id){
  if(!V.detail) V.terugNaar = V.tab;
  V.detail = id; acts = [];
  actUnsub && actUnsub();
  actUnsub = db.collection('activiteiten').where('bedrijfId','==',id).onSnapshot(s => {
    acts = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.datum||'').localeCompare(a.datum||''));
    render();
  }, () => {});
  closeSheet(); render(); window.scrollTo(0,0);
}
function sluitDetail(){ actUnsub && actUnsub(); actUnsub = null; V.detail = null; V.tab = V.terugNaar || 'vandaag'; render(); window.scrollTo(0,0); }

  tab: d => { if(V.detail){ actUnsub && actUnsub(); actUnsub = null; V.detail = null; } V.tab = d.tab; V.filterOpen = false; render(); window.scrollTo(0,0); },
