/* Zoeken op bedrijf, contactpersoon, e-mail of plaats en direct mailen. */
function mailZoekResultaten(q){
  const woorden = q.toLowerCase().split(/\s+/).filter(Boolean);
  const treffers = [];
  for(const b of S.bedrijven){
    (b.contacten||[]).forEach((c, i) => {
      const hooi = [b.naam, b.plaats, c.naam, c.email, c.functie, ...(b.tags||[])].join(' ').toLowerCase();
      if(woorden.every(w => hooi.includes(w))) treffers.push({b, c, i});
    });
  }
  treffers.sort((x,y) => x.b.naam.localeCompare(y.b.naam));
  if(!treffers.length) return `<div class="empty">${ic('search')}<p>Niets gevonden voor "${esc(q)}".</p></div>`;
  return `<div class="rows">${treffers.slice(0,15).map(({b,c,i}) => `<div class="row static" style="grid-template-columns:auto 1fr auto">
    ${mono(b)}<span class="t"><span class="row-top"><b>${esc(b.naam)}</b>${chipKopje(b.kopje)}</span>
      <span class="meta">${esc(c.naam)}${c.functie?' · '+esc(c.functie):''} · ${c.email?esc(c.email):'geen e-mailadres'}</span></span>
    <span class="btns" style="flex-wrap:nowrap">${c.email
      ? `<button class="btn small primary" data-act="mailen" data-id="${b.id}" data-ci="${i}" aria-label="${esc(c.naam)} mailen">${ic('mail','sm')}<span class="lbl">Mailen</span></button><button class="btn small" data-act="mail" data-id="${b.id}" data-ci="${i}" aria-label="Mail opstellen met sjabloon">${ic('note','sm')}<span class="lbl">Opstellen</span></button>`
      : `<button class="btn small" data-act="open" data-id="${b.id}">Openen</button>`}</span></div>`).join('')}</div>
    ${treffers.length > 15 ? `<p class="hint">${treffers.length - 15} meer. Typ verder om te verfijnen.</p>` : ''}`;
}

/* ---------- opvolging plannen: snelkeuzes ---------- */
const PLAN_WAT = ['Bellen','Mailen','Langsgaan','Offerte sturen','Afspraak plannen'];
const planWanneer = () => [
  ['Morgen', addWerkdagen(today(),1)],
  ['Over 3 dagen', REEKS.volgendeWerkdag(addDays(today(),3))],
  ['Volgende week', REEKS.volgendeWerkdag(addDays(today(),7))],
  ['Over 2 weken', REEKS.volgendeWerkdag(addDays(today(),14))],
  ['Over een maand', REEKS.volgendeWerkdag(addDays(today(),30))]
];
/* Velden "wat" en "wanneer" met snelknoppen. metGeen: begint op "Niet plannen". */
function planVelden({id='pl', wat='Bellen', datum=null, metGeen=false, titel=''} = {}){
  const opties = planWanneer();
  const gekozen = metGeen ? '' : (datum || opties[2][1]);
  return `<div class="plan" data-plan="${id}">
    ${titel ? `<h3>${ic('calendar','sm')}${esc(titel)}</h3>` : ''}
    <div class="f"><span>Wat ga je doen?</span>
      <div class="keuzes">${PLAN_WAT.map(w => `<button type="button" class="keuze ${!metGeen && w===wat ? 'on' : ''}" data-wat="${esc(w)}">${esc(w)}</button>`).join('')}</div>
      <input id="${id}-actie" name="planActie" value="${metGeen ? '' : esc(wat)}" placeholder="Of typ zelf, bijv. offerte nabellen" autocomplete="off"></div>
    <div class="f"><span>Wanneer?</span>
      <div class="keuzes">${metGeen ? `<button type="button" class="keuze on" data-dag="">Niet plannen</button>` : ''}${opties.map(([l,d]) => `<button type="button" class="keuze ${d===gekozen ? 'on' : ''}" data-dag="${d}">${l}<small>${fmtDag(d)}</small></button>`).join('')}</div>
      <input id="${id}-datum" name="planDatum" type="date" value="${gekozen}" min="${today()}" aria-label="Of kies een datum"></div>
    <label class="f"><span>Hoe laat? <small style="font-weight:500">(optioneel)</small></span><input id="${id}-tijd" name="planTijd" type="time" value=""></label>
  </div>`;
}
function mountPlan(s, id='pl'){
  const box = s.querySelector(`[data-plan="${id}"]`); if(!box) return;
  const actie = box.querySelector(`#${id}-actie`), datum = box.querySelector(`#${id}-datum`);
  const zet = (sel, el) => { box.querySelectorAll(sel).forEach(x => x.classList.toggle('on', x===el)); };
  box.querySelectorAll('[data-wat]').forEach(k => k.onclick = () => {
    actie.value = k.dataset.wat; zet('[data-wat]', k);
    if(!datum.value){ const std = box.querySelectorAll('[data-dag]')[3] || box.querySelectorAll('[data-dag]')[2]; if(std){ datum.value = std.dataset.dag; zet('[data-dag]', std); } }   // standaard: volgende week
  });
  box.querySelectorAll('[data-dag]').forEach(k => k.onclick = () => { datum.value = k.dataset.dag; zet('[data-dag]', k); if(k.dataset.dag && !actie.value) { actie.value = 'Bellen'; zet('[data-wat]', box.querySelector('[data-wat="Bellen"]')); } });
  actie.oninput = () => zet('[data-wat]', [...box.querySelectorAll('[data-wat]')].find(x => x.dataset.wat === actie.value));
  datum.onchange = () => zet('[data-dag]', [...box.querySelectorAll('[data-dag]')].find(x => x.dataset.dag === datum.value));
}
const leesPlan = d => d.planDatum ? {actie:(d.planActie||'').trim() || 'Opvolgen', datum:d.planDatum, tijd:d.planTijd || null} : null;
async function slaPlanOp(b, plan, ci){
  if(S.mails.some(m => m.bedrijfId===b.id && m.status==='gepland')) await annuleerGepland(b, 'je plande zelf een opvolging');
  await updBedrijf(b.id, {opvolging:{actief:true, stap:'actie', actie:plan.actie, datum:plan.datum, tijd:plan.tijd || null, contact:ci ?? b.opvolging?.contact ?? 0, pogingen:0, gepauzeerd:false}});
  await systeem(b, `Opvolging gepland op ${fmtDag(plan.datum)}${plan.tijd ? ' om '+plan.tijd : ''}: ${plan.actie}.`);
}

/* Opvolging (en een ingeplande mail) uitstellen naar een dag en eventueel tijd naar keuze. */
function uitstellen(b){
  const o = b.opvolging; if(!o?.actief) return;
  const m = o.stap==='mail' ? geplandeMail(b) : null;
  const opties = [['Morgen', addWerkdagen(today(),1)], ['Over 2 dagen', addWerkdagen(today(),2)], ['Volgende week', REEKS.volgendeWerkdag(addDays(today(),7))], ['Over 2 weken', REEKS.volgendeWerkdag(addDays(today(),14))], ['Over een maand', REEKS.volgendeWerkdag(addDays(today(),30))]];
  const tijden = ['09:00','11:00','13:30','15:30'];
  const huidigeTijd = o.tijd || m?.tijd || '';
  openSheet('Uitstellen', `<form id="us" class="section">
    <p class="sub">${esc(b.naam)}${m ? ` · mail "${esc(m.onderwerp)}" schuift mee` : ''}</p>
    <div class="f"><span>Naar wanneer?</span>
      <div class="keuzes">${opties.map(([l,d],i) => `<button type="button" class="keuze ${i?'':'on'}" data-dag="${d}">${l}<small>${fmtDag(d)}</small></button>`).join('')}</div>
      <input id="us-datum" name="datum" type="date" value="${opties[0][1]}" min="${today()}" required aria-label="Of kies een datum"></div>
    <div class="f"><span>Hoe laat? <small style="font-weight:500">(optioneel)</small></span>
      <div class="keuzes"><button type="button" class="keuze ${huidigeTijd?'':'on'}" data-tijd="">Hele dag</button>${tijden.map(t => `<button type="button" class="keuze ${t===huidigeTijd?'on':''}" data-tijd="${t}">${t}</button>`).join('')}</div>
      <input id="us-tijd" name="tijd" type="time" value="${esc(huidigeTijd)}" aria-label="Of kies een tijd"></div>
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">${ic('clock','sm')}Uitstellen</button></div>
  </form>`, s => {
    const datum = s.querySelector('#us-datum'), tijd = s.querySelector('#us-tijd');
    const zet = (sel, el) => s.querySelectorAll(sel).forEach(x => x.classList.toggle('on', x===el));
    s.querySelectorAll('[data-dag]').forEach(k => k.onclick = () => { datum.value = k.dataset.dag; zet('[data-dag]', k); });
    s.querySelectorAll('[data-tijd]').forEach(k => k.onclick = () => { tijd.value = k.dataset.tijd; zet('[data-tijd]', k); });
    datum.onchange = () => zet('[data-dag]', [...s.querySelectorAll('[data-dag]')].find(x => x.dataset.dag===datum.value));
    tijd.oninput = () => zet('[data-tijd]', [...s.querySelectorAll('[data-tijd]')].find(x => x.dataset.tijd===tijd.value));
    s.querySelector('#us').onsubmit = async e => {
      e.preventDefault(); const d = formData(e.target); if(!d.datum) return;
      const wanneer = fmtDag(d.datum) + (d.tijd ? ' om ' + d.tijd : '');
      const ok = await veilig(async () => {
        await updBedrijf(b.id, {opvolging:{...clone(o), datum:d.datum, tijd:d.tijd || null}});
        if(m) await db.collection('mails').doc(m.id).update({datum:d.datum, ...(d.tijd ? {tijd:d.tijd} : {})});
        await systeem(b, `Opvolging uitgesteld naar ${wanneer}.`);
      }, `Uitgesteld naar ${wanneer}`);
      if(ok) closeSheet();
    };
  });
}
async function snooze(b){

function tagsMetReeks(tags, reeksId){

async function verplaatsIntern(b, naar){
  {
    const patch = {kopje:naar};

    if(b.kopje==='prospect' && naar==='klant') patch.wasProspect = true;
    if(naar==='commissie' && !(b.tags||[]).some(t=>t.toLowerCase()===COMMISSIE_TAG)) patch.tags = [...(b.tags||[]), COMMISSIE_TAG];

async function verwijderBedrijf(b){
  await veilig(async () => {
    const as = await db.collection('activiteiten').where('bedrijfId','==',b.id).get();
    for(const d of as.docs) await db.collection('activiteiten').doc(d.id).delete();

/* gebruikers.json in de website-repository lezen en schrijven (alleen beheerders). */
const GEBRUIKERS_PAD = 'site/gebruikers.json';
async function leesGebruikers(token){
  const r = await fetch(`https://api.github.com/repos/${CFG().SITE_REPO}/contents/${GEBRUIKERS_PAD}`, {cache:'no-store', headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'}});
  if(r.status === 404) return {lijst:[], sha:null};
  if(!r.ok) throw new Error(`Gebruikers ophalen lukte niet (${r.status}).`);
  const j = await r.json();
  return {lijst:JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')), c => c.charCodeAt(0)))).gebruikers || [], sha:j.sha};
}
async function schrijfGebruikers(token, lijst, sha, bericht){
  const inhoud = JSON.stringify({gebruikers:lijst}, null, 1) + '\n';
  const bytes = new TextEncoder().encode(inhoud); let bin = ''; bytes.forEach(b => bin += String.fromCharCode(b));
  const r = await fetch(`https://api.github.com/repos/${CFG().SITE_REPO}/contents/${GEBRUIKERS_PAD}`, {method:'PUT', headers:{Authorization:`Bearer ${token}`, Accept:'application/vnd.github+json'},
    body:JSON.stringify({message:bericht, content:btoa(bin), ...(sha ? {sha} : {})})});
  if(r.status === 409) throw new Error('Iemand anders wijzigde tegelijk de gebruikers. Probeer het opnieuw.');
  if(!r.ok) throw new Error(`Opslaan lukte niet (${r.status}). Heeft de sleutel schrijfrechten op ${CFG().SITE_REPO}?`);
  return (await r.json()).content.sha;
}

function weekKolommen(reeks){
  const max = Math.max(1, ...reeks.map(x => x.waarde)), stap = Math.max(1, Math.ceil(reeks.length/5));
  return `<div class="kolommen" role="img" aria-label="${reeks.map(x => `week ${x.wk}: ${x.waarde}`).join(', ')}">${reeks.map((x,i) => `<span class="k ${x.waarde?'':'leeg'}" title="Week ${x.wk} (vanaf ${fmtDag(x.start)}): ${x.waarde}">${x.waarde && (i===reeks.length-1 || x.waarde===max) ? `<em>${x.waarde}</em>` : ''}<i style="height:${(x.waarde/max*100).toFixed(1)}%"></i></span>`).join('')}</div>
    <div class="kolom-labels" aria-hidden="true">${reeks.map((x,i) => `<span>${(reeks.length-1-i) % stap === 0 ? 'wk '+x.wk : ''}</span>`).join('')}</div>`;
}
const telPer = (lijst, sleutel, top = 8) => {
  const m = new Map(); lijst.forEach(b => { const k = sleutel(b) || 'Onbekend'; m.set(k, (m.get(k)||0)+1); });
  let r = [...m.entries()].map(([label, waarde]) => ({label, waarde})).sort((a,b) => b.waarde-a.waarde);
  if(r.length > top){ const rest = r.slice(top-1).reduce((t,x) => t+x.waarde, 0); r = [...r.slice(0, top-1), {label:'Overig', waarde:rest}]; }
  return r;
};

function cijfers(){
  const f = V.filters.dash || {}, weken = Number(f.periode || 13);
  const bs = S.bedrijven.filter(b => matches(b, {...f, periode:undefined}, ''));
  const ids = new Set(bs.map(b => b.id));
  const n = k => bs.filter(b => b.kopje===k).length;
  const gewonnen = bs.filter(b => b.kopje==='klant' && b.wasProspect).length;
  const conv = (sleutel) => {
    const m = new Map();
    bs.filter(b => b.kopje==='prospect' || (b.kopje==='klant' && b.wasProspect)).forEach(b => (sleutel(b)).forEach(k => {
      const r = m.get(k) || {tot:0, klant:0}; r.tot++; if(b.kopje==='klant') r.klant++; m.set(k, r); }));
    return [...m.entries()].map(([label, r]) => ({label, waarde: r.tot ? Math.round(r.klant/r.tot*100) : 0, sub:`${r.klant} van ${r.tot}`})).sort((a,b) => b.waarde-a.waarde || a.label.localeCompare(b.label)).slice(0, 10);
  };
  const convPer = f.conversie || 'tag';
  const convLijst = conv(convPer==='regio' ? b => [regio(b) || provincie(b.postcode) || 'Onbekend'] : convPer==='grootte' ? b => [b.grootte || 'Onbekend'] : b => (b.tags||[]).length ? b.tags : ['(geen tag)']);
  // activiteit per week
  const eind = weekStart(today()), begin = addDays(eind, -7*(weken-1));
  const wekenLijst = Array.from({length:weken}, (_,i) => addDays(begin, 7*i));
  const acts = (alleActs || []).filter(a => ids.has(a.bedrijfId) && a.datum && ds(new Date(a.datum)) >= begin);
  const perWeek = filt => wekenLijst.map(w => ({start:w, wk:weekNr(w), waarde: acts.filter(a => filt(a) && weekStart(ds(new Date(a.datum)))===w).length}));
  const soorten = [['Bezoeken', a => a.type==='bezoek'], ['Telefoontjes', a => a.type==='bel'], ['Mails verstuurd', a => a.type==='mail_uit'], ['Afspraken', a => a.type==='afspraak']]
    .map(([naam, filt]) => ({naam, reeks:perWeek(filt)}));
  // reactie op mails: bedrijven met een verstuurde mail in de periode, en of er binnen 14 dagen contact terugkwam
  const verstuurd = S.mails.filter(m => m.status==='verstuurd' && ids.has(m.bedrijfId) && (m.verstuurdOp||'').slice(0,10) >= begin);
  const perBedrijf = new Map(); verstuurd.forEach(m => { const t = m.verstuurdOp; if(!perBedrijf.has(m.bedrijfId) || t < perBedrijf.get(m.bedrijfId)) perBedrijf.set(m.bedrijfId, t); });
  const terug = [...perBedrijf.entries()].filter(([id, t]) => (alleActs||[]).some(a => a.bedrijfId===id && a.datum > t && a.datum <= new Date(new Date(t).getTime()+14*864e5).toISOString() &&
    (a.type==='mail_in' || a.type==='afspraak' || (a.type==='bel' && a.uitkomst==='gesproken'))) || S.mails.some(m => m.bedrijfId===id && m.status==='ontvangen' && (m.verstuurdOp||'') > t)).length;
  // commissie
  const deals = S.deals.filter(d => ids.has(d.bedrijfId) && (!d.datum || d.datum >= begin || d.status!=='ontvangen'));
  const ct = commissieTotalen(deals);
  const perRelatie = [...new Set(deals.map(d => d.bedrijfId))].map(id => ({label: bedrijf(id)?.naam || '?', waarde: deals.filter(d => d.bedrijfId===id).reduce((t,d) => t+(Number(d.commissie)||0), 0)})).sort((a,b) => b.waarde-a.waarde).slice(0,8);
  return {f, weken, begin, bs, n, gewonnen, convPer, convLijst, soorten, mailsVerstuurd:perBedrijf.size, terug, ct, perRelatie,
    perRegio: telPer(bs, b => regio(b) || provincie(b.postcode)), perGrootte: telPer(bs, b => b.grootte, 6), perBranche: telPer(bs, b => b.branche),
    open: bs.filter(b => opvolgStatus(b)?.due).length};
}

/* Adressen worden omgezet naar coördinaten via de PDOK Locatieserver (Rijksoverheid, alleen het bedrijfsadres). */
async function geocode(q){
  const r = await fetch(`https://api.pdok.nl/bzk/locatieserver/search/v3_1/free?rows=1&fl=centroide_ll&q=${encodeURIComponent(q)}`);
  if(!r.ok) throw new Error('Adres opzoeken lukte niet');
  const doc = (await r.json()).response?.docs?.[0];
  const m = doc?.centroide_ll?.match(/POINT\(([-\d.]+) ([-\d.]+)\)/);
  return m ? {lng:Number(m[1]), lat:Number(m[2])} : null;
}
const adresVan = b => [b.adres, b.postcode, b.plaats].filter(Boolean).join(' ').replace(/\(.*?\)/g,'').trim();
function afstandKm(a, b){ const R = 6371, r = x => x*Math.PI/180, dLat = r(b.lat-a.lat), dLng = r(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
let geoBezig = false;
async function geocodeOntbrekend(){
  if(geoBezig) return; geoBezig = true;
  const todo = S.bedrijven.filter(b => b.plaats && adresVan(b) && (!b.geo || b.geo.q !== adresVan(b))).slice(0, 60);
  V.buurt = {...V.buurt, todo:todo.length}; render();
  for(const b of todo){
    try{ const g = await geocode(adresVan(b)); await updBedrijf(b.id, {geo: g ? {...g, q:adresVan(b)} : {q:adresVan(b), mis:true}}); }catch{ break; }
  }
  geoBezig = false; V.buurt = {...V.buurt, todo:0}; render();
}
function buurtStart(){
  V.buurt = {...(V.buurt||{}), status:'zoeken'}; render();
  geocodeOntbrekend();
  if(!navigator.geolocation){ V.buurt.status = 'geen'; render(); return; }
  navigator.geolocation.getCurrentPosition(p => { V.buurt = {...V.buurt, status:'ok', hier:{lat:p.coords.latitude, lng:p.coords.longitude}, plek:'je huidige locatie'}; render(); },
    () => { V.buurt = {...V.buurt, status:'geen'}; render(); }, {enableHighAccuracy:false, timeout:10000, maximumAge:300000});
}

      <p class="sub">${v.hier ? `Vanaf ${esc(v.plek)}.` : v.status==='geen' ? 'Je locatie is niet beschikbaar. Typ een plaats of postcode.' : 'Locatie bepalen…'}</p></header>
    <form id="buurt-form" class="toolbar"><label class="search">${ic('pin')}<input id="buurt-plek" name="plek" placeholder="Of zoek vanaf een plaats of postcode" autocomplete="off" value="${esc(v.zoek||'')}" aria-label="Plaats of postcode"></label><button class="btn" type="submit">Zoeken</button><button class="btn" type="button" data-act="buurtHier" aria-label="Mijn locatie">${ic('pin','sm')}</button></form>
    <div class="keuzes">${kiesFilter('alle','Alles')}${kiesFilter('prospect','Prospects')}${kiesFilter('klant','Klanten')}${kiesFilter('commissie','Commissie')}${kiesFilter('actie','Met openstaande actie')}</div>
    ${v.todo ? `<p class="hint">${ic('refresh','sm')} Adressen opzoeken (${v.todo})…</p>` : ''}
    ${routeKaart()}
    ${lijst.length ? `<div class="section-title"><h2>${kiezen ? 'Kies je stops' : 'Dichtbij'}</h2><button class="btn small ${kiezen?'':'primary'}" data-act="routeKiezen">${kiezen ? 'Annuleren' : ic('route','sm')+(route() ? 'Nieuwe dagroute' : 'Dagroute plannen')}</button></div>
      ${kiezen ? `<p class="hint">Vink 4 tot 6 bedrijven aan (maximaal ${ROUTE_MAX}). De app zet ze in de handigste volgorde.</p>` : ''}
      <div class="rows">${lijst.map(({b,km}) => { const s = opvolgStatus(b), aan = kiezen && sel.includes(b.id); return kiezen ? `<button class="row ${aan?'gekozen':''}" data-act="routeStop" data-id="${b.id}" aria-pressed="${aan}" style="grid-template-columns:auto auto 1fr">
      <span class="vinkje" aria-hidden="true">${aan ? (sel.indexOf(b.id)+1) : ''}</span><span class="afstand">${km < 10 ? km.toFixed(1).replace('.',',') : Math.round(km)}<small>km</small></span>
      <span class="t"><span class="row-top"><b>${esc(b.naam)}</b>${chipKopje(b.kopje)}</span><span class="meta">${esc([b.adres, b.plaats].filter(Boolean).join(', '))}</span></span></button>` : `<div class="row static" style="grid-template-columns:auto 1fr auto">
      <span class="afstand">${km < 10 ? km.toFixed(1).replace('.',',') : Math.round(km)}<small>km</small></span>
      <span class="t"><span class="row-top"><b>${esc(b.naam)}</b>${chipKopje(b.kopje)}</span>
        <span class="meta">${esc([b.adres, b.plaats].filter(Boolean).join(', '))}</span>
        ${s ? `<span class="next ${s.due?'late':''}">${ic(s.due?'bolt':'clock')}<span>${esc(s.due ? s.label : fmtDag(s.datum)+' · '+(STAP_NAAM[s.stap]||s.label))}</span></span>` : ''}</span>
      <span class="btns" style="flex-wrap:nowrap"><a class="btn small" href="https://www.google.com/maps/dir/?api=1&destination=${b.geo.lat},${b.geo.lng}" target="_blank" rel="noopener" aria-label="Route naar ${esc(b.naam)}">${ic('route','sm')}<span class="lbl">Route</span></a><button class="btn small primary" data-act="open" data-id="${b.id}" aria-label="${esc(b.naam)} openen">${ic('right','sm')}</button></span></div>`; }).join('')}</div>`
      : v.hier ? `<div class="empty">${ic('pin')}<p>Geen bedrijven met een bekend adres gevonden.</p></div>` : ''}
    ${kiezen ? `<div class="bulkbalk" role="toolbar" aria-label="Dagroute"><span><b class="num">${sel.length}</b> ${sel.length===1?'stop':'stops'}</span>
      <button class="btn small primary" data-act="routeMaak" ${sel.length?'':'disabled'}>${ic('route','sm')}Route openen</button></div>` : ''}
    ${zonder ? `<p class="hint">${zonder} bedrijven hebben nog geen plaats en staan hier niet tussen.</p>` : ''}
  </div>`;
}
async function buurtZoek(e){
  e.preventDefault(); const q = String(new FormData(e.target).get('plek')||'').trim(); if(!q) return;
  try{ const g = await geocode(q); if(!g){ toast('Die plaats kan ik niet vinden.'); return; } V.buurt = {...V.buurt, status:'ok', hier:g, plek:q, zoek:q}; render(); }
  catch{ toast('Zoeken lukte niet. Controleer je internet.'); }
}

/* ---------- meldingen op de telefoon ----------
   De telefoon meldt zich aan bij zijn eigen pushdienst; het adres daarvan staat in de
   privé gegevens (meldingen). De herinneringsrobot (GitHub Actions) stuurt elk kwartier
   de opvolgingen van vandaag. Meldingen zijn versleuteld tot op de telefoon. */
const MELDING_KEY = 'desko-crm-melding';
const pushMogelijk = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window && !!window.DESKO_CONFIG?.VAPID_PUBLIC;
const isIphone = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const losGeopend = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
function meldingStaat(){
  if(!pushMogelijk()) return 'kan-niet';
  if(Notification.permission === 'denied') return 'geweigerd';
  return lees(MELDING_KEY) && Notification.permission === 'granted' ? 'aan' : 'uit';
}
function meldingUitleg(){
  return isIphone() && !losGeopend()
    ? 'Op een iPhone werken meldingen alleen vanuit de app op je beginscherm: open deze pagina in Safari, tik op de deelknop en kies <b>Zet op beginscherm</b>. Open de app daarna via het icoon en zet hier de meldingen aan.'
    : 'Deze browser ondersteunt geen meldingen. Gebruik Chrome op Android of de app op het beginscherm van je iPhone.';
}
function meldingSectie(){
  const st = meldingStaat();
  return `<section class="section"><div class="section-title"><h2>Meldingen op deze telefoon</h2></div>
    <div class="card">
      ${st === 'aan' ? `<p>${ic('check','sm')} Meldingen staan aan. Je krijgt op werkdagen een melding als je iemand moet bellen, mailen of bezoeken, met een link naar het profiel.</p>
        <div class="btns"><button class="btn" data-act="meldingTest">Voorbeeld tonen</button><button class="btn ghost" data-act="meldingUit">Uitzetten</button></div>`
      : st === 'geweigerd' ? `<p>Meldingen zijn voor deze app geblokkeerd. Zet ze aan in de instellingen van je telefoon of browser (Meldingen → Desko CRM) en kom hier terug.</p>`
      : st === 'kan-niet' ? `<p>${meldingUitleg()}</p>`
      : `<p>Krijg een melding als je vandaag iemand moet bellen, mailen of bezoeken, bijvoorbeeld <i>"Neem vandaag contact op met Pietje Puk"</i>. Tik erop en het profiel opent.</p>
        <div class="btns"><button class="btn primary" data-act="meldingAan">${ic('bolt','sm')}Meldingen aanzetten</button></div>`}
    </div></section>`;
}
function meldingBanner(){
  if(meldingStaat() !== 'uit' || lees('desko-crm-melding-banner')) return '';
  return `<section class="card banner"><p><b>Herinneringen op je telefoon?</b> Krijg een melding als je iemand moet bellen of bezoeken.</p>
    <div class="btns"><button class="btn primary small" data-act="meldingAan">Aanzetten</button><button class="btn ghost small" data-act="meldingBannerWeg">Niet nu</button></div></section>`;
}
const b64uNaarBytes = s => { const p = '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob((s + p).replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0)); };
async function abonnementId(endpoint){ const h = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(endpoint))); return [...h.slice(0,12)].map(x => x.toString(16).padStart(2,'0')).join(''); }
function apparaatNaam(){ const u = navigator.userAgent; return /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) ? 'iPad' : /Android/.test(u) ? 'Android' : /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : 'Browser'; }
async function meldingAan(){

  try{
    const toestemming = await Notification.requestPermission();
    if(toestemming !== 'granted'){ toast('Meldingen zijn niet toegestaan.'); render(); return; }
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64uNaarBytes(window.DESKO_CONFIG.VAPID_PUBLIC)});
    const j = sub.toJSON(), id = await abonnementId(j.endpoint);
    await db.collection('meldingen').doc(id).set({gebruikerId:S.gebruiker?.id || '', naam:S.gebruiker?.naam || '', apparaat:apparaatNaam(), endpoint:j.endpoint, keys:j.keys, aangemaakt:new Date().toISOString()});
    bewaar(MELDING_KEY, id); render();
    reg.showNotification('Meldingen staan aan', {body:'Zo ziet een herinnering eruit. Tik erop om de app te openen.', icon:'icon-192.png', tag:'welkom', data:{url:'#/vandaag'}});
    toast('Meldingen staan aan');
  }catch(e){ console.error(e); toast('Aanzetten lukte niet. Probeer het opnieuw.'); }
}
async function meldingUit(){

    const id = lees(MELDING_KEY) || (sub && await abonnementId(sub.endpoint));
    if(sub) await sub.unsubscribe();

/* ---------- inspreken ----------
   Spraak naar tekst via de browser (Chrome: Google, Safari: Apple), net als dicteren met het
   toetsenbord. SPRAAK.lees haalt er bedrijf, wat er gebeurde en de volgende stap uit. */
const Herkenning = window.SpeechRecognition || window.webkitSpeechRecognition;
const MAX_OPNAME_MS = 5 * 60 * 1000;
let opname = null;
function stopLuisteren(){ if(!opname) return; const o = opname; opname = null; o.actief = false; try{ o.h && o.h.stop(); }catch{} }
/* Luisteren tot er op stop wordt getikt. De browser stopt zelf na een stilte; dan starten we
   meteen een nieuwe ronde. Elke ronde wordt los samengevoegd (Android herhaalt soms tekst). */
function startOpname(toon, melden){
  stopLuisteren();
  const o = opname = {actief:true, tekst:'', begin:Date.now(), fouten:0, h:null};
  const ronde = () => {
    if(!o.actief) return;
    if(Date.now() - o.begin > MAX_OPNAME_MS){ melden('klaar'); return; }
    const h = o.h = new Herkenning();
    h.lang = 'nl-NL'; h.interimResults = true; h.continuous = true; h.maxAlternatives = 1;
    let deze = '';
    h.onresult = e => { deze = SPRAAK.samenvoegen([...e.results].map(r => r[0].transcript)); o.fouten = 0; toon(SPRAAK.samenvoegen([o.tekst, deze]), true); };
    h.onerror = e => {
      if(['not-allowed', 'service-not-allowed', 'audio-capture'].includes(e.error)){ o.actief = false; melden('fout', e.error === 'audio-capture' ? 'Geen microfoon gevonden.' : 'De app mag de microfoon niet gebruiken. Sta het toe in de instellingen van je telefoon (Chrome of Safari → Microfoon).'); }
      else if(e.error !== 'no-speech' && e.error !== 'aborted' && ++o.fouten >= 3){ o.actief = false; melden('fout', 'Spraakherkenning lukt nu niet. Controleer je internet, of typ hieronder.'); }
    };
    h.onend = () => {
      o.tekst = SPRAAK.samenvoegen([o.tekst, deze]); deze = '';
      if(o.actief){ ronde(); return; }
      toon(o.tekst, false);
    };
    try{ h.start(); }catch{ if(++o.fouten < 3) setTimeout(ronde, 300); else { o.actief = false; melden('fout', 'Spraakherkenning lukt nu niet. Typ hieronder.'); } }
  };
  ronde();
  return o;
}
/* Eén knop: tik → luisteren (tekst verschijnt meteen) → tik → "Klopt dit?". */
function inspreken(vast, tekst = ''){
  stopLuisteren();
  V.inspreekBij = vast?.id || null;
  if(!Herkenning) return inspreekToetsenbord(vast, tekst);
  openSheet('Inspreken', `<div class="section" id="sp">
    ${vast ? `<p class="sub" style="text-align:center">Bij <b>${esc(vast.naam)}</b></p>` : ''}
    <button type="button" class="mic aan" id="sp-mic" aria-label="Stoppen">${ic('mic')}<span class="stopblok"></span></button>
    <p class="mic-status" id="sp-status" aria-live="polite">Luisteren… vertel wat er gebeurde</p>
    <div class="live" id="sp-live" aria-live="polite">${esc(tekst) || `<span class="sub">Bijv. "${vast ? '' : 'Hoek Advocaten '}gebeld, Aukje gesproken, volgende week dinsdag om 2 uur terugbellen"</span>`}</div>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="toetsenbordOpname">Typen</button><button type="button" class="btn primary" id="sp-klaar">${ic('check','sm')}Klaar</button></div>
  </div>`, s => {
    const mic = s.querySelector('#sp-mic'), status = s.querySelector('#sp-status'), live = s.querySelector('#sp-live');
    let tekstNu = tekst, klok = null, t0 = Date.now();
    const toon = t => { tekstNu = SPRAAK.samenvoegen([tekst, t]); if(tekstNu) live.textContent = tekstNu; };
    const tik = () => { const sec = Math.floor((Date.now() - t0) / 1000); status.textContent = `Luisteren… ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')} · tik op stop als je klaar bent`; };
    const melden = (staat, msg) => { clearInterval(klok); mic.classList.remove('aan'); mic.setAttribute('aria-label', 'Opnieuw luisteren'); status.textContent = msg || 'Gestopt. Tik op de microfoon om verder te praten.'; };
    const klaar = () => {
      stopLuisteren(); clearInterval(klok);
      setTimeout(() => {   // laatste woorden nog even laten binnenkomen
        const t = SPRAAK.spel(tekstNu.trim());
        if(!t){ melden('klaar', 'Niets verstaan. Tik op de microfoon en probeer het opnieuw.'); return; }
        spraakBegrepen(t, vast);
      }, 400);
    };
    const start = () => { t0 = Date.now(); mic.classList.add('aan'); mic.setAttribute('aria-label', 'Stoppen'); tik(); clearInterval(klok); klok = setInterval(tik, 1000);
      tekst = tekstNu; startOpname(toon, melden); };
    mic.onclick = () => opname ? klaar() : start();
    s.querySelector('#sp-klaar').onclick = klaar;
    start();
  });
}

/* ---------- tags snel aanpassen ---------- */
/* De mails volgen de tag: na een tagwijziging vervallen mails van een reeks die niet meer bij
   de tags past, en wordt de juiste reeks gestart (bij wisselen meteen, bij een nieuwe tag na
   een vraag). */
async function zetTags(b, tags, {vraag = true} = {}){
  const nieuw = normTags(tags);
  await updBedrijf(b.id, {tags:nieuw});
  return mailsBijTags(b, {...b, tags:nieuw}, {vraag});
}
async function mailsBijTags(oud, b, {vraag = true} = {}){
  const was = REEKS.reeksVoor(oud, S.inst), wordt = REEKS.reeksVoor(b, S.inst);
  if((was?.id || null) === (wordt?.id || null)) return null;
  const gepland = S.mails.filter(m => m.bedrijfId===b.id && m.status==='gepland');
  const liep = gepland.some(m => m.reeks) || (b.opvolging?.actief && b.opvolging.reeks);
  if(gepland.some(m => m.reeks && m.reeks !== wordt?.id)) await annuleerGepland(b, wordt ? `tag gewijzigd naar #${wordt.tag}` : 'tag van de mailreeks verwijderd');
  if(!wordt){
    const o = b.opvolging;
    if(o?.actief && o.reeks) await updBedrijf(b.id, {opvolging:{...clone(o), stap:'actie', actie:'Opvolgen', reeks:null}});
    return null;
  }
  if(b.kopje !== 'prospect') return null;
  const ci = Math.max(0, (b.contacten||[]).findIndex(c => c.email));
  if(liep || !vraag){ if(liep) await startReeks(bedrijf(b.id) || b, b.opvolging?.contact ?? ci); return liep ? wordt : null; }
  reeksVraag([bedrijf(b.id) || b], wordt);
  return null;
}
/* Nieuwe tag van een mailreeks: vragen of de mails moeten starten, met een voorbeeld. */
function reeksVraag(lijst, reeks){
  const met = lijst.filter(b => b.kopje==='prospect' && (b.contacten||[]).some(c => c.email));
  if(!met.length) return;
  const b = met[0], ci = Math.max(0, b.contacten.findIndex(c => c.email));
  const m = REEKS.planMail(b, reeks, 0, today(), S.inst, S.gebruiker?.naam, ci);
  openSheet('Mailreeks starten?', `<div class="section">
    <p>${met.length > 1 ? `${met.length} prospects hebben` : `<b>${esc(b.naam)}</b> heeft`} nu de tag <b>#${esc(reeks.tag)}</b>. Wil je de mails van "${esc(reeks.naam)}" inplannen?</p>
    ${m ? `<div class="begrepen"><span>${ic('mail','sm')}<span>Mail 1 aan ${esc(m.aan)}: <b>"${esc(m.onderwerp)}"</b></span></span><span>${ic('calendar','sm')}${esc(fmtDag(m.datum))} om ${esc(m.tijd)}${reeks.stappen.length > 1 ? ` · daarna nog ${reeks.stappen.length - 1} mail${reeks.stappen.length > 2 ? 's' : ''} als er geen reactie komt` : ''}</span></div>` : ''}
    <div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Nee, alleen de tag</button><button type="button" class="btn primary" id="rv-ja">${ic('mail','sm')}Ja, inplannen</button></div></div>`,
    s => s.querySelector('#rv-ja').onclick = async () => {
      if(await veilig(async () => { for(const x of met){ const y = bedrijf(x.id) || x; await startReeks(y, Math.max(0, y.contacten.findIndex(c => c.email))); } }, met.length > 1 ? `Mails ingepland voor ${met.length} prospects` : 'Mail 1 ingepland')) closeSheet();
    });
}
function tagSheet(b){
  const reeksTags = new Set((S.inst.mailreeksen || []).map(r => r.tag.toLowerCase()));
  const teken = () => {
    const huidig = bedrijf(b.id)?.tags || [], aan = new Set(huidig.map(t => t.toLowerCase()));
    const alle = [...new Set([...huidig, ...alleTags()])].sort((x, y) => (reeksTags.has(y.toLowerCase()) - reeksTags.has(x.toLowerCase())) || x.localeCompare(y));
    return `<div class="section">
      <p class="sub">${esc(b.naam)} · tik om aan of uit te zetten</p>
      <div class="tagkeuze">${alle.map(t => `<button type="button" class="keuze ${aan.has(t.toLowerCase())?'on':''}" data-tagwissel="${esc(t)}" aria-pressed="${aan.has(t.toLowerCase())}">#${esc(t)}${reeksTags.has(t.toLowerCase()) ? '<small>mailreeks</small>' : ''}</button>`).join('')}</div>
      <form id="tg-nieuw" class="toolbar" style="margin-top:6px"><label class="search">${ic('plus')}<input id="tg-tekst" name="tag" placeholder="Nieuwe tag" autocomplete="off" enterkeyhint="done" data-geenfocus></label><button class="btn" type="submit">Toevoegen</button></form>
      <div class="sheet-actions"><button type="button" class="btn primary" data-act="closeSheet">Klaar</button></div></div>`;
  };
  openSheet('Tags', teken(), function mount(s){
    const body = s.querySelector('.sheet-body');

      const bb = bedrijf(b.id), t = k.dataset.tagwissel, l = t.toLowerCase(), had = (bb.tags||[]).some(x => x.toLowerCase()===l);
      let tags = had ? (bb.tags||[]).filter(x => x.toLowerCase()!==l) : [...(bb.tags||[]), t];
      if(!had && reeksTags.has(l)) tags = tagsMetReeks(tags, (S.inst.mailreeksen||[]).find(r => r.tag.toLowerCase()===l).id);
      await veilig(() => zetTags(bb, tags));
      if(!s.isConnected || !document.querySelector('#sheet [data-tagwissel]')) return;   // vraag over de mailreeks staat open
      body.innerHTML = teken(); mount(s);
    });
    s.querySelector('#tg-nieuw').onsubmit = async e => {
      e.preventDefault(); const t = s.querySelector('#tg-tekst').value.replace(/^#/, '').trim(); if(!t) return;
      const bb = bedrijf(b.id); await veilig(() => zetTags(bb, [...(bb.tags||[]), t]), `#${t} toegevoegd`);
      body.innerHTML = teken(); mount(s); s.querySelector('#tg-tekst')?.focus();

}

/* ---------- agenda ---------- */
const AG_SOORT = {route:{naam:'Route', ic:'route'}, opvolg:{naam:'Opvolging', ic:'phone'}, mail:{naam:'Mail', ic:'mail'}, afspraak:{naam:'Afspraak', ic:'calendar'}, commissie:{naam:'Commissie', ic:'euro'}};
const hhmm = iso => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
/* Alles wat gepland staat, per dag: opvolgingen, ingeplande mails, afspraken en commissie. */
function agendaItems(){
  const uit = [];
  S.bedrijven.forEach(b => {
    const s = opvolgStatus(b); if(!s || s.gepauzeerd) return;
    if(s.stap==='mail' && geplandeMail(b)) return;   // de mail zelf staat al in de agenda
    const o = b.opvolging, c = contactVan(b, o.contact);
    const wat = o.stap==='actie' ? (o.actie || 'Opvolgen') : s.max && s.pogingen >= s.max && s.due ? 'Beslissen hoe verder' : STAP_NAAM[o.stap] || 'Opvolgen';
    uit.push({soort:'opvolg', datum:o.datum, tijd:o.tijd || null, b, titel:wat, wie:c?.naam || ''});
  });
  S.mails.filter(m => m.status==='gepland').forEach(m => { const b = bedrijf(m.bedrijfId); if(b) uit.push({soort:'mail', datum:m.datum, tijd:m.tijd||'09:30', b, titel:`Mail${m.reeks ? ' '+(m.stap+1) : ''}: ${m.onderwerp}`, wie:m.aan, m}); });
  (alleActs || []).filter(a => a.type==='afspraak' && a.afspraakOp).forEach(a => { const b = bedrijf(a.bedrijfId); if(b) uit.push({soort:'afspraak', datum:ds(new Date(a.afspraakOp)), tijd:hhmm(a.afspraakOp), b, titel:a.tekst || 'Afspraak', wie:a.contactNaam || '', a}); });
  S.routes.filter(r => r.stops?.length).forEach(r => uit.push({soort:'route', datum:r.datum, tijd:null, b:{naam:`Route ${r.voor || ''}`.trim(), id:null}, titel:`${r.stops.length} bezoek${r.stops.length > 1 ? 'en' : ''}: ${r.stops.map(x => bedrijf(x.id)?.naam).filter(Boolean).slice(0, 3).join(', ')}${r.stops.length > 3 ? '…' : ''}`, wie:'', r}));
  commissieTaken().forEach(t => uit.push({soort:'commissie', datum:t.datum, b:t.b, titel:t.soort==='factureren' ? `Factureren: ${euro(t.d.commissie)}` : `Betaling navragen: ${euro(t.d.commissie)}`, wie:t.d.omschrijving || ''}));
  S.deals.filter(d => d.status==='gefactureerd' && d.gefactureerdOp).forEach(d => { const b = bedrijf(d.bedrijfId); if(!b) return;
    const vervalt = addDays(d.gefactureerdOp, Number(T(b).betaaltermijnDagen)||30);
    if(vervalt > today()) uit.push({soort:'commissie', datum:vervalt, b, titel:`Betaling verwacht: ${euro(d.commissie)}`, wie:d.omschrijving || ''}); });
  return uit.sort((x,y) => x.datum.localeCompare(y.datum) || (x.tijd||'99').localeCompare(y.tijd||'99'));
}
function agItem(x, i){
  const late = x.datum < today() && x.soort!=='afspraak' && x.soort!=='route';
  return `<button class="ag-item ag-${x.soort} ${late?'late':''}" data-act="agendaOpen" data-i="${i}">

function agendaStap(n){
  const v = V.agenda, b = v.datum || today();
  if(!n) v.datum = today();
  else if(v.modus==='week') v.datum = addDays(b, 7*n);
  else { const p = parse(b); v.datum = ds(new Date(p.getFullYear(), p.getMonth()+n, 1)); v.dag = null; }
  render();
}
/* Agenda-bestand met alles van de komende 4 weken. */
function agendaIcs(){
  const t = d => new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const x = v => String(v||'').replace(/\\/g,'\\\\').replace(/([,;])/g,'\\$1').replace(/\n/g,'\\n');
  const tot = addDays(today(), 28);
  const items = agendaItems().filter(i => i.datum >= today() && i.datum <= tot);
  if(!items.length){ toast('Niets gepland in de komende 4 weken.'); return; }
  const ev = items.map((i, n) => {
    const adres = [i.b.adres, [i.b.postcode, i.b.plaats].filter(Boolean).join(' ')].filter(Boolean).join(', ');
    const tijd = i.tijd ? parse(i.datum) : null; if(tijd){ const [h,m] = i.tijd.split(':').map(Number); tijd.setHours(h, m); }
    const wanneer = tijd ? [`DTSTART:${t(tijd)}`, `DTEND:${t(new Date(tijd.getTime() + (i.soort==='afspraak' ? 60 : 15)*60000))}`]
      : [`DTSTART;VALUE=DATE:${i.datum.replace(/-/g,'')}`, `DTEND;VALUE=DATE:${addDays(i.datum,1).replace(/-/g,'')}`, 'TRANSP:TRANSPARENT'];
    return ['BEGIN:VEVENT', `UID:${i.soort}-${i.b.id}-${i.datum}-${n}@desko-crm`, `DTSTAMP:${t(new Date())}`, ...wanneer,
      `SUMMARY:${x(`${AG_SOORT[i.soort].naam}: ${i.b.naam}${i.wie ? ' – '+i.wie : ''}`)}`, `DESCRIPTION:${x(i.titel)}`, adres ? `LOCATION:${x(adres)}` : '', 'END:VEVENT'].filter(Boolean).join('\r\n');
  });
  bewaarBestand(`desko-planning-${today()}.ics`, ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Desko//CRM//NL','CALSCALE:GREGORIAN','METHOD:PUBLISH', ...ev, 'END:VCALENDAR'].join('\r\n'), 'text/calendar;charset=utf-8');
}

/* ---------- jouw week (Vandaag) ----------

function weekOverzicht(){

  const rij = d => {
    const dd = parse(d), r = S.routes.find(x => x.datum===d && x.voor===ik && x.stops?.length);
    const vandaag = d === today();
    const op = items.filter(x => (vandaag ? x.datum <= d : x.datum===d) && x.soort==='opvolg'), ml = items.filter(x => x.datum===d && x.soort==='mail'), af = items.filter(x => x.datum===d && x.soort==='afspraak');

      ...af.map(x => `<span>${ic('calendar','sm')}<b>${esc(x.tijd || '')}</b> afspraak ${esc(x.b.naam)}</span>`)
    ].filter(Boolean);
    let rit = '';

    const leeg = !rit && !delen.length;
    return `<button class="wk-dag ${leeg ? 'leeg' : ''} ${vandaag ? 'nu' : ''}" data-act="weekDag" data-d="${d}" ${r ? 'data-rit="1"' : ''}>
      <span class="cal"><span>${vandaag ? 'nu' : DAGEN[dd.getDay()]}</span><b>${dd.getDate()}</b></span>
      <span class="t">${rit}${delen.length ? `<span class="wk-regels">${delen.join('')}</span>` : ''}${leeg ? '<span class="sub">Nog niets gepland</span>' : ''}</span>${ic('right','sm')}</button>`;
  };

  return `<section class="section"><div class="section-title"><h2>Jouw week</h2><span class="count num">${totaal}</span></div>
    <div class="week">${dagen.map(rij).join('')}</div>

}

/* ---------- dagroute ----------
   Routes staan in de gedeelde gegevens (routes), per dag en per persoon: wat op kantoor bij
   Plannen wordt klaargezet, ziet Ferry op Vandaag. Google Maps krijgt alleen coördinaten.
   Of je net naar Google Maps ging (om daarna te vragen hoe het bezoek ging) blijft op dit toestel. */
const ROUTE_MAX = 9, TERUG_NA_MS = 2*60*1000, ONDERWEG_KEY = 'desko-crm-onderweg';
const naamSlug = n => String(n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'iemand';
const routeId = (datum, voor) => `${datum}--${naamSlug(voor)}`;
const routeVan = (datum, voor) => S.routes.find(r => r.datum===datum && r.voor===voor) || null;
const route = () => routeVan(today(), S.gebruiker?.naam);
async function zetRoute(r){
  if(!r) return;
  const {id, ...data} = r;
  if(!data.stops?.length) await db.collection('routes').doc(id || routeId(r.datum, r.voor)).delete();
  else await db.collection('routes').doc(id || routeId(r.datum, r.voor)).set({...data, bijgewerkt:new Date().toISOString(), door:S.gebruiker?.naam || ''});
}
const onderweg = () => { try{ return JSON.parse(lees(ONDERWEG_KEY) || 'null') || {}; }catch{ return {}; } };
const openStops = r => (r?.stops || []).filter(x => x.status==='open' && bedrijf(x.id));
const mapsPlek = b => `${b.geo.lat},${b.geo.lng}`;
/* Steeds de dichtstbijzijnde volgende stop, daarna 2-opt: kruisende stukken rechtzetten. */
function ordenStops(start, lijst){
  const rest = [...lijst], uit = []; let p = start || rest[0]?.geo;
  while(rest.length){ rest.sort((a,b) => afstandKm(p, a.geo) - afstandKm(p, b.geo)); const n = rest.shift(); uit.push(n); p = n.geo; }
  if(uit.length < 4) return uit;
  const pt = i => i < 0 ? (start || uit[0].geo) : uit[i].geo;
  for(let beter = true, ronde = 0; beter && ronde < 20; ronde++){
    beter = false;
    for(let i = 0; i < uit.length - 2; i++) for(let k = i + 1; k < uit.length - 1; k++){
      const voor = afstandKm(pt(i-1), pt(i)) + afstandKm(pt(k), pt(k+1)), na = afstandKm(pt(i-1), pt(k)) + afstandKm(pt(i), pt(k+1));
      if(na + 1e-9 < voor){ uit.splice(i, k - i + 1, ...uit.slice(i, k + 1).reverse()); beter = true; }
    }
  }
  return uit;
}
/* Zonder vertrekpunt start Google Maps vanaf je huidige locatie. */
function routeUrl(lijst){
  const p = lijst.map(mapsPlek), doel = p.pop();
  return `https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(doel)}${p.length ? '&waypoints='+encodeURIComponent(p.join('|')) : ''}`;
}
function naarMaps(lijst, huidig){
  if(route()) bewaar(ONDERWEG_KEY, JSON.stringify({weg:Date.now(), huidig:huidig || lijst[0]?.id, datum:today()}));
  window.open(routeUrl(lijst), '_blank', 'noopener');
}
function routeKaart(){
  const r = route(); if(!r) return '';
  const open = openStops(r), klaar = r.stops.filter(x => x.status!=='open').length, sch = routeSchema(r), m = sch.maat;
  const naam = {klaar:'Bezocht', overgeslagen:'Overgeslagen'};
  return `<section class="section"><div class="section-title"><h2>Dagroute</h2><span class="count num">${klaar}/${r.stops.length}</span></div>
    <p class="hint">${ic('route','sm')} ${m.weg ? '' : '± '}${m.km} km · ${urenMin(m.rijMin)} rijden · vertrek ${esc(sch.start)}, ${vertrekpunt() ? 'terug' : 'klaar'} ± ${sch.terug}${r.door && r.door !== S.gebruiker?.naam ? ` · klaargezet door ${esc(r.door)}` : ''}</p>
    <div class="rows">${r.stops.map((x,i) => { const b = bedrijf(x.id); if(!b) return ''; const volgende = open[0]?.id===x.id; return `<div class="row static ${x.status!=='open'?'gedaan':''}" style="grid-template-columns:auto 1fr auto">
      <span class="stopnr ${volgende?'nu':''}">${x.status==='klaar' ? ic('check','sm') : i+1}</span>
      <span class="t"><span class="row-top"><b>${esc(b.naam)}</b>${x.status!=='open' ? `<span class="chip">${naam[x.status]}</span>` : ''}</span><span class="meta">${sch.aankomst[b.id] && x.status==='open' ? `<b>± ${sch.aankomst[b.id].tijd}</b> · ` : ''}${esc([b.adres, b.plaats].filter(Boolean).join(', '))}${x.notitie ? ' · '+esc(x.notitie) : ''}</span></span>
      <span class="btns" style="flex-wrap:nowrap">${x.status==='open' ? `<button class="btn small" data-act="routeNaar" data-id="${b.id}" aria-label="Navigeer naar ${esc(b.naam)}">${ic('route','sm')}<span class="lbl">Navigeer</span></button><button class="btn small ${volgende?'primary':''}" data-act="naBezoek" data-id="${b.id}">${ic('check','sm')}<span class="lbl">Klaar</span></button>`
        : `<button class="btn small" data-act="open" data-id="${b.id}" aria-label="${esc(b.naam)} openen">${ic('right','sm')}</button>`}</span></div>`; }).join('')}</div>
    <div class="btns">${open.length ? `<button class="btn primary" data-act="routeHeel">${ic('route','sm')}Route openen${open.length>1 ? ` (${open.length} stops)` : ''}</button>` : `<p class="sub">Alle stops gedaan. Goed bezig!</p>`}<button class="btn ghost" data-act="routeStop2">Route wissen</button></div></section>`;
}
function routeMaak(){
  const v = V.buurt || {}, lijst = (v.sel || []).map(bedrijf).filter(b => b?.geo?.lat);
  if(!lijst.length) return;
  const volgorde = ordenStops(v.hier, lijst);

}

  return `<div class="wrap pijplijn">

/* ---------- plannen ----------
   Op kantoor (of onderweg) een dag voor iemand inplannen: kaart, slimme voorstellen,

const BEZOEK_MIN = 20, KM_FACTOR = 1.3, KMU = 55;     // ± minuten per bezoek, omweg t.o.v. hemelsbreed, gemiddelde snelheid
const werkdagenVanaf = (d, n) => { const uit = []; let x = REEKS.volgendeWerkdag(d); while(uit.length < n){ uit.push(x); x = addWerkdagen(x, 1); } return uit; };
function planStaat(){
  const v = V.plan = V.plan || {};

  if(!v.voor) v.voor = (S.gebruiker?.admin && (S.gebruikers || []).find(g => !g.admin)?.naam) || S.gebruiker?.naam || namen[0] || '';
  if(!v.datum || v.datum < today()) v.datum = REEKS.isWerkdag(today()) && new Date().getHours() < 12 ? today() : addWerkdagen(today(), 1);
  v.filter = v.filter || 'slim';

}
const vertrekpunt = () => S.inst.vertrekpunt?.lat ? S.inst.vertrekpunt : null;
function planRoute(v){ const r = routeVan(v.datum, v.voor); return r ? {...r, stops:r.stops.filter(x => bedrijf(x.id))} : {datum:v.datum, voor:v.voor, stops:[]}; }
/* Afstand en tijd: van vertrekpunt langs alle stops en terug. */
/* ---- route over de weg (OSRM, routeplanner op OpenStreetMap; alleen coördinaten) ----
   Snelste route over de weg, dus via snelwegen waar dat kan. Lukt dat niet, dan een schatting. */
const OSRM = 'https://router.project-osrm.org';
const reisCache = new Map(), reisBezig = new Set();
function routePunten(r){
  const v = vertrekpunt(), stops = r.stops.map(x => bedrijf(x.id)).filter(b => b?.geo?.lat);
  return {stops, pts:[...(v ? [v] : []), ...stops.map(b => b.geo), ...(v && stops.length ? [v] : [])], metVertrek:!!v};
}
const reisSleutel = pts => pts.map(p => `${(+p.lng).toFixed(5)},${(+p.lat).toFixed(5)}`).join(';');
/* Bekende reisgegevens (uit het geheugen of opgeslagen bij de route), anders null. */
function reisVoor(r){
  const {pts} = routePunten(r); if(pts.length < 2) return null;
  const k = reisSleutel(pts);
  return reisCache.get(k) || (r.reis?.sleutel === k ? r.reis : null);
}
async function haalReis(r){
  const {pts} = routePunten(r); if(pts.length < 2) return null;
  const k = reisSleutel(pts);
  if(reisCache.has(k) || reisBezig.has(k)) return reisCache.get(k) || null;
  reisBezig.add(k);
  try{
    const res = await fetch(`${OSRM}/route/v1/driving/${k}?overview=full&geometries=geojson&steps=false`);
    const j = await res.json(); const rt = j.routes?.[0];
    if(j.code !== 'Ok' || !rt) throw new Error('geen route');
    const reis = {sleutel:k, km:Math.round(rt.distance / 1000), rijMin:Math.round(rt.duration / 60), legs:rt.legs.map(l => ({km:Math.round(l.distance / 100) / 10, min:Math.round(l.duration / 60)})),
      lijn:(rt.geometry?.coordinates || []).map(([lng, lat]) => [lat, lng])};
    reisCache.set(k, reis);
    // Delen met de route, zodat de telefoon van de accountmanager hem niet opnieuw hoeft op te vragen
    if(r.id && S.routes.some(x => x.id === r.id) && r.reis?.sleutel !== k){ const {lijn, ...kort} = reis; db.collection('routes').doc(r.id).update({reis:kort}).catch(() => {}); }
    render();
    return reis;
  }catch{ reisCache.set(k, null); return null; }
  finally{ reisBezig.delete(k); }
}
function routeMaat(r){
  const reis = reisVoor(r);
  if(reis) return {km:reis.km, rijMin:reis.rijMin, min:reis.rijMin + r.stops.length * BEZOEK_MIN, weg:true, legs:reis.legs};
  if(r.stops.length && routePunten(r).pts.length >= 2) haalReis(r);
  const {pts} = routePunten(r); let km = 0;
  for(let i = 1; i < pts.length; i++) km += afstandKm(pts[i-1], pts[i]);
  km *= KM_FACTOR;
  const rijMin = Math.round(km / KMU * 60);
  return {km:Math.round(km), rijMin, min:rijMin + r.stops.length * BEZOEK_MIN, weg:false};

/* Tijdschema: vertrektijd + rijden + bezoek per stop. */
function routeSchema(r){
  const m = routeMaat(r), {stops, metVertrek} = routePunten(r);
  const start = r.start || S.inst.kantoortijden?.van || '08:30';
  let t = Number(start.slice(0, 2)) * 60 + Number(start.slice(3, 5));
  const hm = x => `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(Math.round(x) % 60).padStart(2, '0')}`;
  const aankomst = {};
  stops.forEach((b, i) => {
    const leg = m.legs ? m.legs[metVertrek ? i : i - 1] : null;
    if(i > 0 || metVertrek) t += leg ? leg.min : (afstandKm(i ? stops[i-1].geo : vertrekpunt(), b.geo) * KM_FACTOR / KMU * 60);
    aankomst[b.id] = {tijd:hm(t), rij:leg ? leg.min : null}; t += BEZOEK_MIN;
  });
  if(metVertrek && stops.length) t += m.legs ? m.legs[m.legs.length - 1].min : afstandKm(stops[stops.length-1].geo, vertrekpunt()) * KM_FACTOR / KMU * 60;

const urenMin = m => `${Math.floor(m / 60)} u ${String(m % 60).padStart(2, '0')}`;
/* Waarom zou je hier langs moeten? Hoe hoger, hoe belangrijker. */
function planReden(b, datum){
  const o = b.opvolging, uit = [];
  let p = 0;
  if(o?.actief && !o.gepauzeerd && o.datum && o.datum <= addDays(datum, 3)){ const langs = o.stap==='actie' && /langs/i.test(o.actie||''); p += langs ? 70 : 45; uit.push(langs ? 'Langsgaan gepland' : o.datum < datum ? 'Opvolging te laat' : 'Opvolging nodig'); }
  if(isStil(b)){ p += 30; uit.push(b.laatsteContact ? `${diffDays(b.laatsteContact, today())} dagen stil` : 'Nog nooit contact'); }
  if(b.kopje==='prospect' && (b.status||'nieuw')==='nieuw' && !b.laatsteContact){ p += 20; if(!uit.includes('Nog nooit contact')) uit.push('Nieuwe prospect'); }
  if(b.kopje==='klant') p += 5;
  if(b.status==='verloren') p -= 100;
  return {p, reden:uit[0] || KOPJES[b.kopje]?.enk || ''};
}
function planKandidaten(v, r){
  const inRoute = new Set(r.stops.map(x => x.id));
  const elders = new Map(); S.routes.filter(x => x.datum >= today() && !(x.datum===v.datum && x.voor===v.voor)).forEach(x => x.stops.forEach(st => elders.set(st.id, x)));
  const ref = r.stops.map(x => bedrijf(x.id)?.geo).filter(g => g?.lat);
  const basis = ref.length ? ref : (vertrekpunt() ? [vertrekpunt()] : []);
  const zoek = (v.zoek || '').toLowerCase();
  return S.bedrijven.filter(b => b.geo?.lat && !inRoute.has(b.id) && b.status!=='verloren')
    .filter(b => !zoek || [b.naam, b.plaats, ...(b.tags||[])].join(' ').toLowerCase().includes(zoek))
    .map(b => { const {p, reden} = planReden(b, v.datum); const km = basis.length ? Math.min(...basis.map(g => afstandKm(g, b.geo))) : null; return {b, p, reden, km, elders:elders.get(b.id)}; })
    .filter(x => v.filter==='alle' || zoek ? true : v.filter==='opvolging' ? /Opvolging|Langsgaan/.test(x.reden) : v.filter==='stil' ? /stil|nooit/.test(x.reden) : v.filter==='nieuw' ? x.reden==='Nieuwe prospect' : x.p > 0)
    .sort((a, c) => (a.elders ? 1 : 0) - (c.elders ? 1 : 0) || (c.p - (c.km ?? 0) * 1.5) - (a.p - (a.km ?? 0) * 1.5));
}
/* Slim vullen: begin bij de belangrijkste, voeg steeds de beste dichtbij toe, zet in volgorde. */
function slimVullen(v, r, doel = 6){
  const stops = r.stops.map(x => bedrijf(x.id)).filter(Boolean);
  let pool = planKandidaten({...v, filter:'slim', zoek:''}, r).filter(x => !x.elders && x.p > 0);
  const vp = vertrekpunt();
  if(!stops.length && pool.length){
    const binnen = vp ? pool.filter(x => afstandKm(vp, x.b.geo) <= 45) : pool;
    const anker = (binnen.length ? binnen : pool).sort((a, c) => c.p - a.p)[0];
    stops.push(anker.b); pool = pool.filter(x => x !== anker);
  }
  while(stops.length < doel && pool.length){
    const km = x => Math.min(...stops.map(b => afstandKm(b.geo, x.b.geo)));
    const kies = pool.filter(x => km(x) <= 25).sort((a, c) => (c.p - km(c) * 2) - (a.p - km(a) * 2))[0];
    if(!kies) break;
    stops.push(kies.b); pool = pool.filter(x => x !== kies);
  }
  const oud = new Map(r.stops.map(x => [x.id, x]));
  return ordenStops(vp, stops).map(b => oud.get(b.id) || {id:b.id, status:'open'});
}

  r.stops.forEach((x, i) => { const b = bedrijf(x.id); if(!b?.geo?.lat) return; const ll = [b.geo.lat, b.geo.lng]; lijn.push(ll); punten.push(ll);
    L.marker(ll, {icon:L.divIcon({className:'kaartnr', html:`<span>${i+1}</span>`, iconSize:[30, 30], iconAnchor:[15, 15]})}).bindTooltip(esc(b.naam)).addTo(planLaag); });
  if(vp){ lijn.push([vp.lat, vp.lng]); L.marker([vp.lat, vp.lng], {icon:L.divIcon({className:'kaartnr thuis', html:'<span>⌂</span>', iconSize:[30, 30], iconAnchor:[15, 15]})}).bindTooltip('Vertrek: ' + esc(vp.adres)).addTo(planLaag); punten.push([vp.lat, vp.lng]); }
  const weg = reisCache.get(reisSleutel(routePunten(r).pts));
  if(weg?.lijn?.length) L.polyline(weg.lijn, {color:'#1F7A3C', weight:5, opacity:.85, lineJoin:'round'}).addTo(planLaag);
  else if(lijn.length > 1) L.polyline(lijn, {color:'#1F7A3C', weight:4, opacity:.8, dashArray:'2 8', lineCap:'round'}).addTo(planLaag);
  const sleutel = v.datum + v.voor + r.stops.length;
  if(punten.length && planKaart._desko !== sleutel){ planKaart._desko = sleutel; planKaart.fitBounds(punten, {padding:[40, 40], maxZoom:13}); }
}

/* Tekstherkenning draait op het apparaat zelf (Tesseract); de foto wordt niet verstuurd. */
function laadScript(src){ return new Promise((ok, fout) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fout(new Error('Laden mislukt')); document.head.appendChild(s); }); }
function scanKaartje(){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.setAttribute('capture', 'environment');
  inp.onchange = async () => {
    const f = inp.files?.[0]; if(!f) return;
    openSheet('Kaartje lezen', `<div class="section"><p>Even geduld, de tekst wordt gelezen…</p><p class="hint" id="scan-voortgang">Voorbereiden</p></div>`);
    try{
      if(!window.Tesseract) await laadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
      const r = await Tesseract.recognize(f, 'nld+eng', {logger: m => { const el = document.getElementById('scan-voortgang'); if(el && m.progress != null) el.textContent = `${m.status} ${Math.round(m.progress*100)}%`; }});
      const k = leesKaartje(r.data.text || '');
      closeSheet();
      bedrijfForm(null, 'prospect', {bron:'visitekaartje', ruw:k.ruw, bedrijf:{naam:k.bedrijf, adres:k.adres, postcode:k.postcode, plaats:k.plaats, tags:['netwerk']},
        contact:k.contact, notitie:['Visitekaartje gescand.', k.extra].filter(Boolean).join('\n')});
    }catch(err){ closeSheet(); toast('Het kaartje lezen lukte niet. Vul de gegevens zelf in.'); bedrijfForm(null, 'prospect'); }
  };
  inp.click();
}
/* Haalt bedrijf, naam, functie, telefoon, e-mail en adres uit de herkende tekst. */
function leesKaartje(tekst){
  const ruw = tekst.replace(/\r/g,'').trim();
  const regels = ruw.split('\n').map(x => x.replace(/\s+/g,' ').trim()).filter(x => x.length > 1);
  const alles = regels.join('\n');
  const email = (alles.replace(/\s*@\s*/g,'@').match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [''])[0].toLowerCase();
  const web = (alles.replace(/[\w.+-]+@[\w.-]+/g,'').match(/\b(?:https?:\/\/)?(?:www\.)?[\w-]+\.(?:nl|com|eu|be|biz|net|org|info|de)\b/i) || [''])[0];
  // Telefoonnummers: niet doorlopen in een postcode of ander nummer.
  const telSchoon = t => { const max = /^(\+|00)/.test(t) ? 12 : 10; let x = t.trim(); while(x.replace(/\D/g,'').length > max && /\s\S+$/.test(x)) x = x.replace(/\s\S+$/, ''); return x.replace(/[\s\-–]+$/,''); };
  const tels = [...alles.replace(/\b\d{4}\s?[A-Z]{2}\b/g,'|').matchAll(/(?:\+31|0031|\b0)[\d\s\-().]{8,18}\d/g)].map(m => telSchoon(m[0].replace(/\s+/g,' '))).filter(t => t.replace(/\D/g,'').length >= 9);
  const mobiel = tels.find(t => /^(?:\+31|0031)\s*\(?0?\)?\s*6|^06/.test(t)) || '';
  const pc = alles.match(/\b(\d{4})\s?([A-Z]{2})\b[ ,]*([A-Za-zÀ-ÿ'.\- ]{2,40})?/);
  const STRAAT = /([A-Z][A-Za-zÀ-ÿ.'\- ]*?(?:straat|weg|laan|plein|pad|kade|gracht|singel|dijk|hof|park|steeg|dreef|baan|ring|markt|veld|haven|werf|zijde|kant|boulevard|hoek|wal|polder|erf)\s+\d+\s?[a-zA-Z]?(?:\s?-\s?\d+)?)\b/;
  let adres = (alles.replace(/[\w.+-]+@[\w.-]+/g,'').match(STRAAT) || [''])[0].replace(/^(e-?mail|tel|telefoon|mobiel|adres)\s*:?\s*/i,'').trim();
  if(!adres && pc){
    const i = regels.findIndex(r => r.includes(pc[1]));
    const voor = i >= 0 ? regels[i].slice(0, regels[i].indexOf(pc[1])).split(/[|·•]/).map(x => x.trim()).filter(Boolean).pop() || '' : '';
    if(/[a-z]/i.test(voor) && /\d/.test(voor) && !/tel|mob|fax|@/i.test(voor)) adres = voor.replace(/[,]+$/,'');
    else if(i > 0 && /[a-z].*\d/i.test(regels[i-1]) && !/@|www|tel|mob|fax|\+31/i.test(regels[i-1])) adres = regels[i-1];
  }
  const FUNCTIE = /(manager|directeur|directie|eigenaar|owner|founder|ceo|uitvoerder|adviseur|inkoop|inkoper|projectleider|projectmanager|calculator|werkvoorbereider|co[öo]rdinator|sales|editor|planner|planning|vestigingsmanager|accountmanager|boormeester|specialist|designer|secretar|office manager|facilitair)/i;
  const BEDRIJF = /\b(b\.?v\.?|n\.?v\.?|bouw|groep|group|installatie|techniek|aannemer\w*|bedrijf|services?|transport|logistiek|verhuur|interieur|facility|makelaardij|holding)\b/i;
  const schoon = r => !/[@\d]|www\.|https?:/i.test(r);
  const functieRegel = regels.find(r => FUNCTIE.test(r) && r.length < 60 && !/@|www/.test(r)) || '';
  const isNaam = r => schoon(r) && r !== functieRegel && !BEDRIJF.test(r) && r.split(' ').length <= 6 &&
    /^(?:[A-ZÀ-Ý]\.)*\s*(?:\([A-Za-zÀ-ÿ]+\)\s*)?[A-ZÀ-Ý][\p{L}'.-]*(?:\s+(?:van|de|der|den|ter|ten|het|\([A-Za-zÀ-ÿ]+\)|[A-ZÀ-Ý][\p{L}'.)-]*))+$/u.test(r);
  const fi = regels.indexOf(functieRegel);
  let naam = fi > 0 && isNaam(regels[fi-1]) ? regels[fi-1] : (regels.find(isNaam) || '');
  // "A.J.S. Duinmaijer (Arjan)" en "W.A. (Ron) van Lamoen" -> roepnaam + achternaam
  naam = naam.replace(/^(?:[A-ZÀ-Ý]\.)+\s*\(([^)]+)\)\s*(.+)$/, '$1 $2').replace(/^(?:[A-ZÀ-Ý]\.)+\s*(.+?)\s*\(([^)]+)\)$/, '$2 $1').trim();
  const domein = (email.split('@')[1] || web.replace(/^(https?:\/\/)?(www\.)?/i,'')).split('.')[0].toLowerCase() || '';
  const vrij = /^(gmail|hotmail|outlook|live|yahoo|icloud|kpnmail|ziggo)$/i.test(domein);
  const kern = r => r.toLowerCase().replace(/[^a-z0-9]/g,'');
  let bedrijf = '';
  if(domein && !vrij){
    const i = regels.findIndex(r => schoon(r) && r !== naam && r !== functieRegel && kern(r).length >= 3 && (domein.includes(kern(r)) || (kern(r).includes(domein) && domein.length >= 4) || (kern(r).length >= 4 && domein.startsWith(kern(r).slice(0,4)) && kern(r).length <= domein.length + 12) || (/^([A-Z]\.){2,}/.test(r) && domein.startsWith(kern(r).slice(0,3)))));
    if(i >= 0){ bedrijf = regels[i]; const vlg = regels[i+1]; if(vlg && schoon(vlg) && vlg.split(' ').length <= 3 && BEDRIJF.test(vlg) && bedrijf.split(' ').length <= 2) bedrijf += ' ' + vlg; }
  }
  if(!bedrijf) bedrijf = regels.find(r => schoon(r) && BEDRIJF.test(r) && r.length < 50 && r !== naam) || (!vrij && domein ? domein.replace(/[-_]/g,' ').replace(/\b\w/g, c => c.toUpperCase()) : '');
  const extra = [web && 'Website: '+web, ...tels.filter(t => t !== (mobiel || tels[0])).map(t => 'Tel: '+t)].filter(Boolean).join(' · ');
  return {ruw, bedrijf, adres, postcode: pc ? `${pc[1]} ${pc[2]}` : '', plaats: pc?.[3] ? pc[3].trim().replace(/\s+(tel|t|e|m|www)\b.*$/i,'') : '',
    contact:{naam, functie: functieRegel, telefoon: mobiel || tels[0] || '', email}, extra};
}

/* ---------- navigatie ---------- */
/* ---------- terugknop ----------
   Elk scherm heeft een adres (#/agenda, #/b/<id>), zodat de terugknop van telefoon en browser
   binnen de app terug gaat en een melding direct een klantprofiel kan openen. Staat er een
   venster (sheet) open, dan sluit terug alleen dat venster en blijf je op hetzelfde scherm. */
const routeHash = r => r.detail ? '#/b/' + r.detail : '#/' + (r.tab || 'vandaag');
function leesHash(hash = location.hash){
  const h = hash.replace(/^#\/?/, '');
  if(h.startsWith('b/')) return {detail:decodeURIComponent(h.slice(2))};
  return {tab:h || 'vandaag'};
}
function navTo(r){
  const hash = routeHash(r);
  if(location.hash !== hash) history.pushState({tab:r.tab || null, detail:r.detail || null, vanApp:true}, '', hash);
}
function toonRoute(r){
  if(r.detail && bedrijf(r.detail)){ if(V.detail !== r.detail) openDetail(r.detail, {stil:true}); return; }
  if(V.detail){ actUnsub && actUnsub(); actUnsub = null; V.detail = null; }
  V.selectie = null; V.tab = r.tab || V.terugNaar || 'vandaag'; V.filterOpen = false; render(); window.scrollTo(0,0);
}
window.addEventListener('popstate', e => {
  if(!$('#sheet').hidden){
    closeSheet();
    const r = V.detail ? {detail:V.detail} : {tab:V.tab};     // blijf op dit scherm
    history.pushState({tab:r.tab || null, detail:r.detail || null, vanApp:true}, '', routeHash(r));
    return;
  }
  toonRoute(e.state || leesHash());
});

function openDetail(id, {stil} = {}){
  if(!V.detail) V.terugNaar = V.tab;
  if(!stil) navTo({detail:id});
  V.detail = id; acts = [];
  actUnsub && actUnsub();
  actUnsub = db.collection('activiteiten').where('bedrijfId','==',id).onSnapshot(s => {
    acts = s.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (b.datum||'').localeCompare(a.datum||''));
    render();
  }, () => {});
  closeSheet(); render(); window.scrollTo(0,0);
}
function sluitDetail(){
  if(history.state?.detail === V.detail && history.state?.vanApp){ history.back(); return; }   // popstate doet de rest
  actUnsub && actUnsub(); actUnsub = null; V.detail = null; V.tab = V.terugNaar || 'vandaag'; navTo({tab:V.tab}); render(); window.scrollTo(0,0);
}

    V.buurt = {...V.buurt, sel}; render(); },
  routeMaak,
  routeHeel: () => naarMaps(openStops(route()).map(x => bedrijf(x.id))),
  routeNaar: d => naarMaps([bedrijf(d.id)], d.id),
  naBezoek: d => naBezoek(bedrijf(d.id)),
  routeStop2: () => bevestig('Route wissen', 'De dagroute van vandaag verdwijnt. Vastgelegde bezoeken blijven gewoon bewaard.', 'Wissen', () => veilig(() => zetRoute({...route(), stops:[]}))),
  planDag: d => { planStaat().datum = d.d; render(); },
  weekDag: d => { if(d.rit){ const v = planStaat(); v.datum = d.d; v.voor = S.gebruiker?.naam || v.voor; ACT.tab({tab:'plannen'}); return; }
    V.agenda = {modus:'week', filter:'alle', ...(V.agenda || {}), datum:d.d}; ACT.tab({tab:'agenda'}); },
  pijpFase: d => { V.pijp.fase = d.f; render(); },
  pijpSchuif: d => { const b = bedrijf(d.id), i = FASEN.findIndex(([f]) => f===(b.status||'nieuw')) + Number(d.n); if(FASEN[i]) zetFase(b, FASEN[i][0]); },
  pijpRit: d => { const v = planStaat(), r = planRoute(v);
    if(r.stops.some(x => x.id===d.id)){ planStops(r.stops.filter(x => x.id!==d.id)); return; }
    if(!bedrijf(d.id)?.geo?.lat){ toast('Adres onbekend: vul eerst de plaats in.'); return; }
    ACT.planErbij({id:d.id}); toast(`Op de rit van ${fmtDag(v.datum)}`); },
  planFilter: d => { planStaat().filter = d.f; render(); },
  planVertrek: () => planVertrekSheet(),
  planErbij: d => { const v = planStaat(), r = planRoute(v); if(r.stops.some(x => x.id===d.id)) return; if(r.stops.length >= ROUTE_MAX){ toast(`Maximaal ${ROUTE_MAX} stops.`); return; }
    const b = bedrijf(d.id), stops = [...r.stops];
    // op de plek waar de omweg het kleinst is
    let best = stops.length, extra = Infinity; const vp = vertrekpunt(), g = i => i < 0 ? vp?.lat ? vp : null : i >= stops.length ? (vp?.lat ? vp : null) : bedrijf(stops[i].id)?.geo;
    for(let i = 0; i <= stops.length; i++){ const a = g(i-1), c = g(i); const kost = (a ? afstandKm(a, b.geo) : 0) + (c ? afstandKm(b.geo, c) : 0) - (a && c ? afstandKm(a, c) : 0); if(kost < extra){ extra = kost; best = i; } }
    stops.splice(best, 0, {id:d.id, status:'open'}); planStops(stops); },
  planWeg: d => planStops(planRoute(planStaat()).stops.filter(x => x.id!==d.id)),
  planSchuif: d => { const st = [...planRoute(planStaat()).stops], i = Number(d.i), j = i + Number(d.n); if(j < 0 || j >= st.length) return; [st[i], st[j]] = [st[j], st[i]]; planStops(st); },
  planSlim: () => { const v = planStaat(), r = planRoute(v), st = slimVullen(v, r); if(st.length === r.stops.length) toast('Geen geschikte voorstellen meer dichtbij.'); planStops(st); },
  planOptimaliseer: async () => {
    const r = planRoute(planStaat()), oud = new Map(r.stops.map(x => [x.id, x])), bs = r.stops.map(x => bedrijf(x.id)).filter(b => b?.geo?.lat), vp = vertrekpunt();
    let volgorde = null;
    if(vp && bs.length >= 2){   // snelste volgorde over de weg (OSRM trip), terug naar het vertrekpunt
      try{
        const pts = [vp, ...bs.map(b => b.geo)], j = await (await fetch(`${OSRM}/trip/v1/driving/${reisSleutel(pts)}?source=first&roundtrip=true&overview=false`)).json();
        if(j.code === 'Ok') volgorde = bs.map((b, i) => [b, j.waypoints[i + 1].waypoint_index]).sort((a, c) => a[1] - c[1]).map(x => x[0]);
      }catch{}
    }
    planStops((volgorde || ordenStops(vp, bs)).map(b => oud.get(b.id)));
    toast(volgorde ? 'Snelste volgorde over de weg' : 'Volgorde met de kortste afstand'); },
  planWis: () => bevestig('Route wissen', 'Alle stops van deze dag worden verwijderd.', 'Wissen', () => planStops([])),
  buurtHier: () => { V.buurt = {...V.buurt, status:null, zoek:''}; buurtStart(); },
  toonStil: () => { V.filters.alle = {contact:'stil'}; V.zoek.alle = ''; V.tab = 'alle'; V.detail = null; navTo({tab:'alle'}); render(); window.scrollTo(0,0); },
  selecteer: d => { V.selectie = V.selectie?.kopje===d.kopje ? null : {kopje:d.kopje, ids:new Set()}; render(); },
  kies: d => { const ids = V.selectie.ids; ids.has(d.id) ? ids.delete(d.id) : ids.add(d.id); render(); },
  kiesAlles: d => { const lijst = gefilterd(d.kopje); V.selectie.ids = V.selectie.ids.size===lijst.length ? new Set() : new Set(lijst.map(b => b.id)); render(); },
  bulk: d => bulkSheet(d.doe),
  ics: d => { const b = bedrijf(d.id), a = acts.find(x => x.id===d.akt); if(b && a) bewaarIcs(b, a); },
  actBewerk: d => { const a = acts.find(x => x.id===d.akt), b = bedrijf(V.detail); if(a && b) actBewerk(b, a); },
  snel: () => snelMenu(),
  snelKies: d => kiesBedrijf(d.doel),
  inspreken: d => inspreken(d.id ? bedrijf(d.id) : null),
  tagSheet: d => tagSheet(bedrijf(d.id)),
  tagWeg: d => { const b = bedrijf(d.id); veilig(() => zetTags(b, (b.tags||[]).filter(t => t !== d.tag)), `#${d.tag} verwijderd`); },
  verversen: (d, el) => { document.querySelectorAll('.ververs').forEach(x => x.classList.add('bezig')); setTimeout(() => location.reload(), 150); },
  appOpname: () => inspreken(V.inspreekBij ? bedrijf(V.inspreekBij) : null, $('#sp-tekst')?.value || ''),
  toetsenbordOpname: () => { const t = $('#sp-live')?.textContent || ''; inspreekToetsenbord(V.inspreekBij ? bedrijf(V.inspreekBij) : null, $('#sp-live .sub') ? '' : t); },
  snelDoel: d => { const b = bedrijf(d.id); closeSheet(); if(d.doel==='bezoek') actForm(b, 'bezoek'); else if(d.doel==='bel') belSheet(b); else planActie(b); },
  pauzeer: d => { const b = bedrijf(d.id); veilig(async () => { await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), gepauzeerd:true}}); await systeem(b, 'Opvolging gepauzeerd.'); }, 'Gepauzeerd'); },
  hervat: d => { const b = bedrijf(d.id); veilig(async () => { const o = clone(b.opvolging); o.gepauzeerd = false; if(o.datum < today()) o.datum = today(); await updBedrijf(b.id, {opvolging:o}); await systeem(b, 'Opvolging hervat.'); }, 'Hervat'); },
  stopReeks: d => { const b = bedrijf(d.id); bevestig('Opvolging stoppen', 'Er komen geen herinneringen meer voor dit bedrijf tot je een nieuwe opvolging start.', 'Stoppen', () => veilig(() => stopReeks(b, 'handmatig gestopt'), 'Gestopt')); },
  doorgaan: d => { const b = bedrijf(d.id); veilig(async () => { await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), pogingen:0, datum:today()}}); await systeem(b, 'Opvolging gaat door met een nieuwe reeks pogingen.'); }, 'Gaat door'); },
  later: d => laterSheet(bedrijf(d.id)),
  verloren: d => { const b = bedrijf(d.id); bevestig('Op verloren zetten', `${b.naam} krijgt status verloren en de opvolging stopt.`, 'Op verloren zetten', () => veilig(async () => {
      const patch = {opvolging:{...clone(b.opvolging), actief:false}}; if(b.kopje==='prospect') patch.status = 'verloren';
      await updBedrijf(b.id, patch); await systeem(b, 'Op verloren gezet na het maximum aantal pogingen.'); }, 'Op verloren gezet')); },
  omzetten: d => { const b = bedrijf(d.id); bevestig('Omzetten naar klant', `${b.naam} wordt een klant. De tijdlijn gaat mee.`, 'Omzetten', () => verplaats(b, 'klant')); },
  verplaats: d => verplaatsSheet(bedrijf(d.id)),
  verwijder: d => { const b = bedrijf(d.id); bevestig('Bedrijf verwijderen', `${b.naam}, alle contactpersonen, de tijdlijn en commissiedeals worden definitief verwijderd. Dit kan niet ongedaan worden gemaakt.`, 'Definitief verwijderen', () => verwijderBedrijf(b)); },
  dealForm: d => dealForm(bedrijf(d.id), d.deal),
  dealStatus: d => dealStatus(d.deal, d.status),
  filters: () => { V.filterOpen = !V.filterOpen; render(); },
  wisFilters: d => { V.filters[d.kopje] = {}; V.zoek[d.kopje] = ''; render(); },
  weergave: d => { const w = S.weergaven.find(x=>x.id===d.id); if(!w) return; V.filters[w.kopje] = {...w.filters}; V.zoek[w.kopje] = w.zoek||''; render(); },
  bewaarWeergave: d => openSheet('Weergave bewaren', `<form id="wv" class="section"><label class="f"><span>Naam</span><input id="wv-naam" name="naam" required placeholder="bijv. Door to door Noord-Holland" autocomplete="off"></label><div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">Bewaren</button></div></form>`,
      s => s.querySelector('#wv').onsubmit = async e => { e.preventDefault(); const naam = formData(e.target).naam.trim();
        if(await veilig(() => db.collection('weergaven').add({naam, kopje:d.kopje, filters:{...(V.filters[d.kopje]||{})}, zoek:V.zoek[d.kopje]||''}), 'Weergave bewaard')) closeSheet(); }),
  beheerWeergaven: d => openSheet('Weergaven', `<div class="section">${S.weergaven.filter(w=>w.kopje===d.kopje).map(w=>`<div class="row-top"><span>${esc(w.naam)}</span><button class="btn small danger" data-act="verwijderWeergave" data-id="${w.id}">Verwijderen</button></div>`).join('')}</div>`),
  verwijderWeergave: d => veilig(() => db.collection('weergaven').doc(d.id).delete(), 'Verwijderd').then(closeSheet),
  export: d => exportSheet(d.kopje),
  wachtwoord: () => wachtwoordWijzigen(),
  uitloggen: () => { bewaar(SESSIE_KEY, null); history.replaceState(null, '', '#/vandaag'); location.reload(); },
  gebruikerWeg: d => { const g = S.beheer?.lijst.find(x => x.id === d.id); bevestig('Toegang intrekken', `${g?.naam||'Deze gebruiker'} kan daarna niet meer inloggen. Wil je zeker weten dat iemand er niet meer bij kan, maak dan ook een nieuwe GitHub-sleutel (zie README).`, 'Intrekken', () => gebruikerWeg(d.id)); },
  opnieuwInloggen: () => { S.login = {}; render(); }
};

/* Dubbel tikken telt als één keer: dezelfde knop binnen een halve seconde wordt genegeerd. */
let laatsteKlik = {el:null, t:0};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault();
  if(el === laatsteKlik.el && Date.now() - laatsteKlik.t < 500) return;
  laatsteKlik = {el, t:Date.now()};
  fn(el.dataset, el);
});
document.addEventListener('submit', e => {
  const f = e.target;
  if(f.dataset.bezig){ e.preventDefault(); e.stopImmediatePropagation(); return; }
  f.dataset.bezig = '1'; setTimeout(() => { delete f.dataset.bezig; }, 1000);
}, true);
document.addEventListener('input', e => { const f = e.target.closest?.('form'); if(f) delete f.dataset.bezig; }, true);   // iets aangepast: opnieuw versturen mag
document.addEventListener('input', e => {
  if(e.target.id === 'pijp-zoek'){ V.pijp.zoek = e.target.value; clearTimeout(V._pz); V._pz = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $('#pijp-zoek'); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch{} } }, 200); return; }
  if(e.target.id === 'plan-zoek'){ planStaat().zoek = e.target.value; clearTimeout(V._pz); V._pz = setTimeout(() => { const pos = e.target.selectionStart; render(); const el = $('#plan-zoek'); if(el){ el.focus(); try{ el.setSelectionRange(pos, pos); }catch{} } }, 200); return; }
  const z = e.target.dataset?.zoek; if(z==null) return;
  V.zoek[z] = e.target.value; render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id==='plan-start'){ const v = planStaat(), r = planRoute(v); if(r.stops.length) veilig(() => zetRoute({...r, id:routeId(v.datum, v.voor), start:t.value || null})); return; }
  if(t.id==='pijp-regio'){ V.pijp.regio = t.value; render(); return; }
  if(t.id==='pijp-netwerk'){ V.pijp.metNetwerk = t.checked; render(); return; }
  if(t.id==='pijp-dag'){ planStaat().datum = t.value; render(); return; }
  if(t.dataset?.planVoor !== undefined && t.id==='plan-voor'){ planStaat().voor = t.value; render(); return; }
  if(t.dataset?.dash){ V.filters.dash = {...(V.filters.dash||{}), [t.dataset.dash]: t.value}; render(); return; }
  if(t.dataset?.filter){ const k = t.dataset.kopje; V.filters[k] = {...(V.filters[k]||{}), [t.dataset.filter]: t.value}; render(); }
  if(t.dataset?.actChange==='status'){
    const b = bedrijf(t.dataset.id), nieuw = t.value;
    veilig(async () => { await updBedrijf(b.id, {status:nieuw}); await systeem(b, `Status: ${b.status||'nieuw'} → ${nieuw}.`); if(nieuw==='verloren') await stopReeks({...b, status:nieuw}, 'op verloren gezet'); }, `Status: ${nieuw}`);
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- opstarten ---------- */
let gestart = false;
function start(sessie){
  S.sessie = sessie;
  S.gebruiker = {naam:sessie.naam, admin:sessie.admin, id:sessie.id};
  if(gestart){ render(); return; } gestart = true;
  db = makeDb({repo:CFG().DATA_REPO, token:sessie.token, gebruiker:sessie.naam});
  const fout = e => {
    if(e?.code==='auth'){ bewaar(SESSIE_KEY, null); toast('Je bent uitgelogd. Log opnieuw in.'); setTimeout(() => location.reload(), 1500); }
    else toast('Gegevens laden lukte niet. Controleer je internet.');
  };
  /* Opslaan gebeurt op de achtergrond; laat zien als dat even duurt of niet lukt. */
  let opslagTimer = null;
  db.status(st => {
    const el = $('#opslag'); clearTimeout(opslagTimer); el.dataset.open = st.open;
    if(st.fout === 'auth'){ fout({code:'auth'}); return; }
    if(st.fout === 'mislukt'){ toast('Een wijziging kon niet worden opgeslagen. Probeer het opnieuw.'); }
    if(!st.open){ el.hidden = true; return; }
    const toon = () => { el.className = 'opslag' + (st.fout === 'wacht' ? ' wacht' : ''); el.textContent = st.fout === 'wacht' ? `${st.open} wijziging${st.open>1?'en':''} nog niet opgeslagen, wordt opnieuw geprobeerd` : 'Opslaan…'; el.hidden = false; };
    if(st.fout === 'wacht') toon(); else opslagTimer = setTimeout(toon, 2500);
  });
  let eersteRoute = true;
  db.collection('bedrijven').onSnapshot(s => { S.bedrijven = s.docs.map(d => ({id:d.id, ...d.data()})); S.laden = false;
    if(eersteRoute){ eersteRoute = false; const r = leesHash(); history.replaceState({tab:r.tab||null, detail:r.detail||null}, '', location.hash || '#/vandaag'); if(r.detail || (r.tab && r.tab!=='vandaag')){ toonRoute(r); return; } }
    render(); }, e => { S.laden = false; render(); fout(e); });
  db.collection('deals').onSnapshot(s => { S.deals = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fout);
  db.collection('weergaven').onSnapshot(s => { S.weergaven = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fout);
  db.collection('mails').onSnapshot(s => { S.mails = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('routes').onSnapshot(s => { S.routes = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('exportlog').orderBy('datum','desc').limit(50).onSnapshot(s => { S.exportlog = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.doc('instellingen/algemeen').onSnapshot(s => { S.inst = REEKS.instellingen(s.exists ? s.data() : {}); render(); }, () => {});
  db.doc('robot/status').onSnapshot(s => { S.robot = s.exists ? s.data() : null; render(); }, () => {});
  render();
}
(async () => {
  const cfg = CFG();
  if(!cfg.DATA_REPO || !cfg.SITE_REPO || !window.crypto?.subtle){ S.laden = false; S.geenDb = true; render(); return; }
  render();
  try{ const r = await fetch('gebruikers.json', {cache:'no-store'}); S.gebruikers = r.ok ? ((await r.json()).gebruikers || []) : []; }
  catch{ S.gebruikers = []; }
  let sessie = null; try{ sessie = JSON.parse(lees(SESSIE_KEY) || 'null'); }catch{}
  // Ingetrokken gebruikers worden bij het openen uitgelogd.
  if(sessie && S.gebruikers.length && !S.gebruikers.some(g => g.id === sessie.id)){ bewaar(SESSIE_KEY, null); sessie = null; }
  if(!sessie){ S.laden = false; render(); return; }
  try{ await controleerToegang(cfg.DATA_REPO, sessie.token); start(sessie); }
  catch(err){ bewaar(SESSIE_KEY, null); S.laden = false; S.login = {fout:'Je sessie is verlopen. Log opnieuw in.'}; render(); }
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
