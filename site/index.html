  sluitDetail,
  closeSheet,
  nieuw: d => bedrijfForm(null, d.kopje || (['klant','prospect','commissie'].includes(V.tab) ? V.tab : 'prospect')),
  bedrijfForm: d => bedrijfForm(bedrijf(d.id)),
  contactForm: d => contactForm(bedrijf(d.id), d.ci!=null ? Number(d.ci) : null),
  actForm: d => actForm(bedrijf(d.id), d.type),
  bel: d => belSheet(bedrijf(d.id), d.ci!=null ? Number(d.ci) : undefined),
  mail: d => mailOpstellen(d.id ? bedrijf(d.id) : null, d.ci!=null ? Number(d.ci) : undefined),
  sjabloon: d => sjabloonForm(d.i!=null ? Number(d.i) : null),
  mailen: d => { const m = d.mail ? S.mails.find(x => x.id===d.mail) : null; mailen(bedrijf(d.id || m?.bedrijfId), d.ci!=null ? Number(d.ci) : undefined, m); },
  mailHandmatig: d => mailHandmatig(d.richting, d.id ? bedrijf(d.id) : null),
  mailDetail: d => { const m = S.mails.find(x => x.id===d.mail); if(m) mailDetail(m); },
  geplandeMail: d => { const m = S.mails.find(x => x.id===d.mail); if(m) geplandeMailSheet(m); },
  planActie: d => planActie(bedrijf(d.id)),
  reeksStart: d => reeksStart(bedrijf(d.id)),
  actieKlaar: d => { const b = bedrijf(d.id); veilig(async () => { await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), actief:false}}); await systeem(b, `Actie afgerond: ${b.opvolging.actie}.`); }, 'Afgerond'); },
  pauzeer: d => { const b = bedrijf(d.id); veilig(async () => { await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), gepauzeerd:true}}); await systeem(b, 'Opvolging gepauzeerd.'); }, 'Gepauzeerd'); },
  hervat: d => { const b = bedrijf(d.id); veilig(async () => { const o = clone(b.opvolging); o.gepauzeerd = false; if(o.datum < today()) o.datum = today(); await updBedrijf(b.id, {opvolging:o}); await systeem(b, 'Opvolging hervat.'); }, 'Hervat'); },
  stopReeks: d => { const b = bedrijf(d.id); bevestig('Opvolging stoppen', 'Er komen geen herinneringen meer voor dit bedrijf tot je een nieuwe opvolging start.', 'Stoppen', () => veilig(() => stopReeks(b, 'handmatig gestopt'), 'Gestopt')); },
  doorgaan: d => { const b = bedrijf(d.id); veilig(async () => { await updBedrijf(b.id, {opvolging:{...clone(b.opvolging), pogingen:0, datum:today()}}); await systeem(b, 'Opvolging gaat door met een nieuwe reeks pogingen.'); }, 'Gaat door'); },
  later: d => laterSheet(bedrijf(d.id)),
  verloren: d => { const b = bedrijf(d.id); bevestig('Op verloren zetten', `${b.naam} krijgt status verloren en de opvolging stopt.`, 'Op verloren zetten', () => veilig(async () => {
      const patch = {opvolging:{...clone(b.opvolging), actief:false}}; if(b.kopje==='prospect') patch.status = 'verloren';
      await updBedrijf(b.id, patch); await systeem(b, 'Op verloren gezet na het maximum aantal pogingen.'); }, 'Op verloren gezet')); },
  omzetten: d => { const b = bedrijf(d.id); bevestig('Omzetten naar klant', `${b.naam} wordt een klant. De tijdlijn gaat mee.`, 'Omzetten', () => verplaats(b, 'klant')); },
  verplaats: d => verplaatsSheet(bedrijf(d.id)),
  verwijder: d => { const b = bedrijf(d.id); bevestig('Bedrijf verwijderen', `${b.naam}, alle contactpersonen, de tijdlijn en commissiedeals worden definitief verwijderd. Dit kan niet ongedaan worden gemaakt.`, 'Definitief verwijderen', () => verwijderBedrijf(b)); },
  dealForm: d => dealForm(bedrijf(d.id), d.deal),
  dealStatus: d => dealStatus(d.deal, d.status),
  filters: () => { V.filterOpen = !V.filterOpen; render(); },
  wisFilters: d => { V.filters[d.kopje] = {}; V.zoek[d.kopje] = ''; render(); },
  weergave: d => { const w = S.weergaven.find(x=>x.id===d.id); if(!w) return; V.filters[w.kopje] = {...w.filters}; V.zoek[w.kopje] = w.zoek||''; render(); },
  bewaarWeergave: d => openSheet('Weergave bewaren', `<form id="wv" class="section"><label class="f"><span>Naam</span><input id="wv-naam" name="naam" required placeholder="bijv. Door to door Noord-Holland" autocomplete="off"></label><div class="sheet-actions"><button type="button" class="btn" data-act="closeSheet">Annuleren</button><button class="btn primary" type="submit">Bewaren</button></div></form>`,
      s => s.querySelector('#wv').onsubmit = async e => { e.preventDefault(); const naam = formData(e.target).naam.trim();
        if(await veilig(() => db.collection('weergaven').add({naam, kopje:d.kopje, filters:{...(V.filters[d.kopje]||{})}, zoek:V.zoek[d.kopje]||''}), 'Weergave bewaard')) closeSheet(); }),
  beheerWeergaven: d => openSheet('Weergaven', `<div class="section">${S.weergaven.filter(w=>w.kopje===d.kopje).map(w=>`<div class="row-top"><span>${esc(w.naam)}</span><button class="btn small danger" data-act="verwijderWeergave" data-id="${w.id}">Verwijderen</button></div>`).join('')}</div>`),
  verwijderWeergave: d => veilig(() => db.collection('weergaven').doc(d.id).delete(), 'Verwijderd').then(closeSheet),
  export: d => exportSheet(d.kopje),
  wachtwoord: () => wachtwoordWijzigen(),
  uitloggen: () => { bewaar(SESSIE_KEY, null); location.reload(); },
  gebruikerWeg: d => { const g = S.beheer?.lijst.find(x => x.id === d.id); bevestig('Toegang intrekken', `${g?.naam||'Deze gebruiker'} kan daarna niet meer inloggen. Wil je zeker weten dat iemand er niet meer bij kan, maak dan ook een nieuwe GitHub-sleutel (zie README).`, 'Intrekken', () => gebruikerWeg(d.id)); },
  opnieuwInloggen: () => { S.login = {}; render(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const fn = ACT[el.dataset.act]; if(!fn) return;
  e.preventDefault(); fn(el.dataset, el);
});
document.addEventListener('input', e => {
  const z = e.target.dataset?.zoek; if(z==null) return;
  V.zoek[z] = e.target.value; render();
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset?.filter){ const k = t.dataset.kopje; V.filters[k] = {...(V.filters[k]||{}), [t.dataset.filter]: t.value}; render(); }
  if(t.dataset?.actChange==='status'){
    const b = bedrijf(t.dataset.id), nieuw = t.value;
    veilig(async () => { await updBedrijf(b.id, {status:nieuw}); await systeem(b, `Status: ${b.status||'nieuw'} → ${nieuw}.`); if(nieuw==='verloren') await stopReeks({...b, status:nieuw}, 'op verloren gezet'); }, `Status: ${nieuw}`);
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape' && !$('#sheet').hidden) closeSheet(); });

/* ---------- opstarten ---------- */
let gestart = false;
function start(sessie){
  S.sessie = sessie;
  S.gebruiker = {naam:sessie.naam, admin:sessie.admin, id:sessie.id};
  if(gestart){ render(); return; } gestart = true;
  db = makeDb({repo:CFG().DATA_REPO, token:sessie.token, gebruiker:sessie.naam});
  const fout = e => {
    if(e?.code==='auth'){ bewaar(SESSIE_KEY, null); toast('Je bent uitgelogd. Log opnieuw in.'); setTimeout(() => location.reload(), 1500); }
    else toast('Gegevens laden lukte niet. Controleer je internet.');
  };
  db.collection('bedrijven').onSnapshot(s => { S.bedrijven = s.docs.map(d => ({id:d.id, ...d.data()})); S.laden = false; render(); }, e => { S.laden = false; render(); fout(e); });
  db.collection('deals').onSnapshot(s => { S.deals = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fout);
  db.collection('weergaven').onSnapshot(s => { S.weergaven = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, fout);
  db.collection('mails').onSnapshot(s => { S.mails = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.collection('exportlog').orderBy('datum','desc').limit(50).onSnapshot(s => { S.exportlog = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, () => {});
  db.doc('instellingen/algemeen').onSnapshot(s => { S.inst = REEKS.instellingen(s.exists ? s.data() : {}); render(); }, () => {});
  db.doc('robot/status').onSnapshot(s => { S.robot = s.exists ? s.data() : null; render(); }, () => {});
  render();
}
(async () => {
  const cfg = CFG();
  if(!cfg.DATA_REPO || !cfg.SITE_REPO || !window.crypto?.subtle){ S.laden = false; S.geenDb = true; render(); return; }
  render();
  try{ const r = await fetch('gebruikers.json', {cache:'no-store'}); S.gebruikers = r.ok ? ((await r.json()).gebruikers || []) : []; }
  catch{ S.gebruikers = []; }
  let sessie = null; try{ sessie = JSON.parse(lees(SESSIE_KEY) || 'null'); }catch{}
  // Ingetrokken gebruikers worden bij het openen uitgelogd.
  if(sessie && S.gebruikers.length && !S.gebruikers.some(g => g.id === sessie.id)){ bewaar(SESSIE_KEY, null); sessie = null; }
  if(!sessie){ S.laden = false; render(); return; }
  try{ await controleerToegang(cfg.DATA_REPO, sessie.token); start(sessie); }
  catch(err){ bewaar(SESSIE_KEY, null); S.laden = false; S.login = {fout:'Je sessie is verlopen. Log opnieuw in.'}; render(); }
})();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
